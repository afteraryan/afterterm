<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>afterterm mascot: Fix the bug</title>
<!--
  The film in landscape (16:9). Open this file in a browser to watch it. Render it with:
    node assets/mascot/render.mjs assets/mascot/films/fix-the-bug.html out/fix-the-bug.mp4
  The story is in fix-the-bug.js; ../README.md explains how it is put together.
-->
<link rel="stylesheet" href="film.css">
</head>
<body>
<main>
  <h1>The mascot gets a task, works on it, loses its temper, loses a dot and gets it back</h1>
  <svg id="stage" role="img" aria-label="The afterterm mascot in a short film"></svg>
  <input id="bar" type="range" value="0" aria-label="Position in the film">
  <div class="line">
    <p class="cap"><span class="clock" id="clock"></span><span id="cap"></span></p>
    <button type="button" id="play">Pause</button><button type="button" id="restart">Restart</button>
  </div>
</main>
<script src="../mascot.js"></script>
<script src="fix-the-bug.js"></script>
</body>
</html>
