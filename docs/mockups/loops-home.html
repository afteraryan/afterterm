<title>Loops on Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a control bar, then afterterm's Home drawn at 1280x860 and scaled to fit: two columns, loops in one, Pinned and Projects in the other. Single dark look, like the app. Solid colours only: no tinted washes. */
:root {
  color-scheme: dark;
  --bg: #212121; --pane: #191919; --side: #171717; --hover: #2f2f2f; --hover2: #383838; --raise: #2a2a2a; --line: #2a2a2a;
  --text: #ececec; --text2: #b4b4b4; --text3: #8e8e8e; --text4: #5c5c5c;
  --btn: #ececec; --btn-text: #0d0d0d;
  --green: #4ade80; --green-ink: #06170b;
  --rot: #e8a23a; --ink: #141414;
  --chip: #3a3a3a;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Cascadia Code', 'Cascadia Mono', Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { background: var(--side); color: var(--text); }
body { font-family: var(--sans); font-size: 14px; line-height: 1.45; margin: 0; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }

.wrap { padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; max-width: 1400px; margin: 0 auto; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-start; }
.ctl { display: grid; gap: 6px; min-width: 0; }
.ctl-name { font-size: 11px; color: var(--text3); letter-spacing: .04em; text-transform: uppercase; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--pane); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { background: none; border: 0; border-radius: 7px; padding: 5px 10px; font-size: 13px; color: var(--text2); cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--text); background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); }

.stage-box { position: relative; width: 100%; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); }
.stage { position: absolute; left: 0; top: 0; width: 1280px; height: 860px; transform-origin: 0 0; background: var(--side); display: grid; grid-template-rows: 32px 1fr; overflow: hidden; }
.titlebar { display: flex; align-items: center; gap: 10px; padding-left: 14px; font-size: 12px; color: var(--text3); }
.titlebar .name { color: var(--text2); }
.titlebar .grow { flex: 1; }
.caps { display: flex; height: 100%; }
.caps span { width: 46px; display: grid; place-items: center; }
.body { display: grid; grid-template-columns: 76px 1fr; min-height: 0; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 10px; }
.rail-btn { width: 40px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--text3); }
.rail-btn.on { background: var(--hover); color: var(--text); }
.rail-sep { width: 32px; height: 1px; background: var(--line); margin: 4px 0; }
.tile { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 13px; font-weight: 500; color: #111; }

.screen { background: var(--bg); border-radius: 16px 0 0 0; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #444 transparent; }
.home { max-width: 1140px; margin: 0 auto; padding: 28px 28px 60px; display: grid; gap: 40px; align-items: start; }
.home.loops-right { grid-template-columns: 360px minmax(0, 1fr); }
.home.loops-left { grid-template-columns: minmax(0, 1fr) 360px; }
.colm { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.date { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -.01em; }
.tot { display: flex; gap: 6px; margin-top: 12px; }
.sig { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 7px; background: var(--hover); font-size: 12.5px; color: var(--text2); }
.lasthere { color: var(--text3); font-size: 12.5px; margin-top: 8px; }
.lbl { font-size: 13px; color: var(--text3); margin-bottom: 10px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cd { background: var(--hover); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 84px; }
.cd .hd { display: flex; align-items: center; gap: 9px; font-weight: 500; font-size: 13.5px; min-width: 0; }
.cd .hd span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd .f { display: flex; color: var(--text3); font-size: 12.5px; margin-top: auto; }
.cd .f .ago { margin-left: auto; }
.pic { border-radius: 6px; display: grid; place-items: center; color: #111; font-weight: 500; flex: none; }
.pr { display: flex; align-items: center; border-radius: 9px; min-width: 0; }
.pr .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr .t { color: var(--text3); font-size: 12.5px; }
.plist.current .pr { gap: 12px; padding: 9px 12px; font-weight: 500; }
.plist.current .pic { width: 26px; height: 26px; font-size: 12px; border-radius: 7px; }
.plist.compact .pr { gap: 10px; padding: 0 10px; height: 32px; font-size: 13px; }
.plist.compact .pic { width: 16px; height: 16px; font-size: 9.5px; border-radius: 4px; }
.plist.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.plist.grid .pr { gap: 8px; padding: 0 10px; height: 34px; font-size: 13px; background: var(--hover); }
.plist.grid .pic { width: 16px; height: 16px; font-size: 9.5px; border-radius: 4px; }
.plist.grid .t { display: none; }
.more { color: var(--text3); padding: 8px 10px; font-size: 13px; }

/* count card */
.count { background: var(--raise); border-radius: 16px; padding: 16px 18px; display: grid; gap: 12px; }
.count .big { display: flex; align-items: baseline; gap: 8px; }
.count .big b { font-size: 30px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.count .big span { color: var(--text2); }
.track { height: 6px; border-radius: 3px; background: #444; overflow: hidden; display: block; }
.track i { display: block; height: 100%; background: var(--green); }
.split { display: flex; gap: 6px; flex-wrap: wrap; }
.split button { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 8px; border: 0; background: none; color: var(--text2); font-size: 13px; cursor: pointer; }
.split button:hover { background: var(--hover2); color: var(--text); }
.split b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.rot-n { min-width: 20px; height: 20px; border-radius: 10px; background: var(--rot); color: var(--ink); font-weight: 600; display: grid; place-items: center; padding: 0 6px; font-size: 12px; font-variant-numeric: tabular-nums; }

/* filters */
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fseg { display: inline-flex; background: var(--pane); border-radius: 9px; padding: 2px; gap: 2px; }
.fseg button { border: 0; background: none; border-radius: 7px; padding: 4px 10px; font-size: 12.5px; color: var(--text2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.fseg button:hover { color: var(--text); background: var(--hover); }
.fseg button.on { background: var(--btn); color: var(--btn-text); }
.fbtn { border: 0; background: var(--pane); border-radius: 9px; padding: 0 10px; height: 30px; font-size: 12.5px; color: var(--text2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.fbtn:hover { color: var(--text); background: var(--hover); }
.fbtn.on { background: var(--btn); color: var(--btn-text); }
.fgrow { flex: 1; }

/* rows */
.rows { display: flex; flex-direction: column; gap: 1px; }
.row { display: flex; align-items: center; gap: 10px; padding: 0 10px; min-height: 38px; border-radius: 10px; cursor: pointer; min-width: 0; border: 0; background: none; text-align: left; width: 100%; color: var(--text); flex: none; }
.row:hover, .row.open-row { background: var(--hover); }
.row .t1 { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.closed .t1 { color: var(--text3); }
.row.sub { min-height: 32px; }
.row.sub .t1 { font-size: 13px; }
.pname { font-size: 12.5px; white-space: nowrap; flex: none; max-width: 30%; overflow: hidden; text-overflow: ellipsis; }
.when { font-size: 12.5px; color: var(--text3); flex: none; width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.st { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
.st-open { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--text3); }
.st-closed { width: 15px; height: 15px; border-radius: 50%; background: var(--green); display: grid; place-items: center; color: var(--green-ink); }
.st-rot { width: 15px; height: 15px; border-radius: 50%; background: var(--rot); display: grid; place-items: center; color: var(--ink); }
.frac { font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums; flex: none; padding: 2px 5px; border-radius: 5px; }
.frac:hover { background: #444; color: var(--text); }
.kind { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--chip); color: var(--text); font-size: 12px; flex: none; }

/* shape: table */
.thead, .row.tr { display: grid; grid-template-columns: 16px minmax(0, 1fr) 132px 44px 74px 34px; gap: 12px; align-items: center; }
.thead { padding: 0 10px 6px; font-size: 12px; color: var(--text3); border-bottom: 1px solid #333; margin-bottom: 4px; }
.thead span:nth-child(4), .thead span:nth-child(6) { text-align: right; }
.row.tr .frac { justify-self: end; }
.row.tr .pname { max-width: none; }
.tkind { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text2); }
/* shape: tile */
.ptile { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 500; color: #111; flex: none; }
/* shape: two lines */
.row.two { min-height: 50px; padding-block: 6px; align-items: flex-start; }
.row.two .st { margin-top: 2px; }
.row.two .tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row.two .tx .t1 { flex: none; }
.row.two .t2 { font-size: 12.5px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.row.two .t2 i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.row.two .when, .row.two .frac { margin-top: 2px; }

/* an opened loop */
.det { margin: 4px 0 8px 36px; padding-right: 10px; }
.det.box { background: #2b2b2b; border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; margin-right: 10px; }
.det.box .note, .det.chip .note, .det.plain .note { font-size: 13px; color: var(--text2); }
.det.chip { display: flex; align-items: flex-start; gap: 10px; }
.det.chip .note { padding-top: 2px; }
.det.grid { display: grid; grid-template-columns: 56px 1fr; gap: 6px 12px; font-size: 13px; align-items: center; }
.det.grid .k { color: var(--text3); font-size: 12.5px; }
.det.grid .v { color: var(--text2); }
.subs { display: flex; flex-direction: column; gap: 1px; margin-left: 26px; }
.subs .det { margin-left: 26px; }

.menu { position: absolute; z-index: 30; min-width: 176px; background: #2f2f2f; border: 1px solid #3d3d3d; border-radius: 10px; padding: 4px; box-shadow: 0 10px 28px #000; display: flex; flex-direction: column; }
.menu button { border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 7px; font-size: 13px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; }
.menu button .lbl2 { flex: 1; }
.menu button .chev { color: var(--text3); }
.menu button .chk { width: 12px; }
.menu button:hover, .menu button.hl { background: #3d3d3d; }
.menu .sep { height: 1px; background: #3d3d3d; margin: 4px 6px; }
.menu .danger { color: #f87171; }
.toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--btn); color: var(--btn-text); font-size: 13px; padding: 7px 14px; border-radius: 999px; z-index: 40; }
.empty { color: var(--text3); font-size: 13px; padding: 24px 10px; text-align: center; }

.cfg { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.cfg pre { margin: 0; flex: 1; min-width: 0; background: var(--pane); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: 12px; color: var(--text2); overflow-x: auto; white-space: pre; }
.copy { border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-text); padding: 0 18px; font-size: 13px; font-weight: 500; cursor: pointer; min-height: 40px; }
</style>

<div class="wrap">
  <div class="controls" id="controls"></div>
  <div class="stage-box" id="stageBox"><div class="stage" id="stage"></div></div>
  <div class="cfg"><pre id="cfgOut"></pre><button class="copy" id="copyBtn" type="button">Copy config</button></div>
</div>

<script>
(function () {
  var OPTIONS = [
    { key: 'position', name: 'Loops column', values: [['right', 'Right'], ['left', 'Left']] },
    { key: 'projects', name: 'Projects list', values: [['current', 'As today'], ['compact', 'Compact rows'], ['grid', 'Two columns']] },
    { key: 'shape', name: 'Row shape', values: [['rows', 'Rows'], ['table', 'Table'], ['tile', 'Project tile'], ['twoLine', 'Two lines']] },
    { key: 'opened', name: 'Opened loop', values: [['box', 'In a box'], ['chip', 'Kind beside note'], ['grid', 'Labelled'], ['rowChip', 'Kind on the row']] },
    { key: 'kindIcons', name: 'Kind', values: [['icons', 'Icon and word'], ['words', 'Word only']] }
  ];
  var cfg = { position: 'right', projects: 'compact', shape: 'rows', opened: 'box', kindIcons: 'icons' };
  try { var sv = JSON.parse(localStorage.getItem('loops-home2-cfg') || 'null'); if (sv) for (var k in sv) if (k in cfg) cfg[k] = sv[k]; } catch (e) {}

  var P = { 'afterterm': '#5b8def', 'minimi-windows': '#e07a5f', 'afterthought': '#9b7ede', 'canvas-agent': '#4fb3a4', 'General': '#8e8e8e', 'transcript-fetcher-clone': '#d4a24c', 'aftertales': '#e46a9a' };
  var LOOPS = [
    { t: 'Loops always-visible view', p: 'afterterm', s: 'open', k: 'Feature', when: '2m', note: 'Card agreed. Home next.', subs: [
      { t: 'Design doc', s: 'closed', k: 'Feature', when: '1h', note: 'Decisions on AFT-82.' },
      { t: 'Mock of the loops card', s: 'closed', k: 'Feature', when: '5m', note: 'Setup picked.' },
      { t: 'Loops on Home', s: 'open', k: 'Feature', when: '2m', note: 'Second pass of the mock.' },
      { t: 'afterterm loops CLI', s: 'open', k: 'Idea', when: '3h', note: 'list, new, update, close, ping.' },
      { t: 'Loops screen', s: 'open', k: 'Idea', when: '1h', note: 'Maybe not needed.' } ] },
    { t: 'Header shows the old model', p: 'afterterm', s: 'closed', k: 'Bug', when: '40m', note: 'Merged in PR #98.' },
    { t: 'Snapshot calendar on Windows', p: 'minimi-windows', s: 'open', k: 'Feature', when: '5h', note: 'Week view left.', subs: [
      { t: 'Calendar permissions', s: 'closed', k: 'Feature', when: '1d', note: 'Works on Windows 11.' },
      { t: 'Week view', s: 'open', k: 'Feature', when: '5h', note: 'Layout done, events missing.' } ] },
    { t: 'GitHub poll page', p: 'afterthought', s: 'open', k: 'Feature', when: '1d', note: 'Poll form built, results page next.' },
    { t: 'Rail tile order', p: 'afterterm', s: 'open', k: 'Bug', when: '2d', note: 'Waiting on the order picker design.', subs: [
      { t: 'Group pinned tiles', s: 'closed', k: 'Bug', when: '3d', note: 'Done.' },
      { t: 'Order picker', s: 'open', k: 'Idea', when: '2d', note: 'Three options to mock.' },
      { t: 'Badge meanings', s: 'closed', k: 'Bug', when: '2d', note: 'Tooltips added.' } ] },
    { t: 'Memory between canvas sessions', p: 'canvas-agent', s: 'open', k: 'Idea', when: '2d', note: 'Store a summary per board.' },
    { t: 'Daily Chrome activity summary', p: 'General', s: 'open', k: 'Idea', when: '2d', note: 'Read history, summarise each evening.' },
    { t: 'Usage in the title bar', p: 'afterterm', s: 'closed', k: 'Feature', when: '2d', note: 'Shipped in 0.16.0.' },
    { t: 'Transcript fetcher clone', p: 'transcript-fetcher-clone', s: 'open', k: 'Feature', when: '2d', note: 'Fetch works, export left.' },
    { t: 'Founder build installer', p: 'minimi-windows', s: 'rotting', k: 'Bug', when: '4d', note: 'Signing step fails on a clean PC.' },
    { t: 'Story page redesign', p: 'aftertales', s: 'rotting', k: 'Feature', when: '6d', note: 'Two layouts drafted.' },
    { t: 'Shell integration for WSL', p: 'afterterm', s: 'rotting', k: 'Feature', when: '9d', note: 'Needs a machine with WSL.' },
    { t: 'Export polls as CSV', p: 'afterthought', s: 'rotting', k: 'Feature', when: '12d', note: 'Started, then paused for the poll page.' }
  ];
  var filter = { status: 'all', kinds: {}, project: null };
  var opened = { '0': true };

  var I = {
    tick: '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.2l2 2L8 3"/></svg>',
    clock: '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 2.4v2.8l1.7 1"/></svg>',
    Feature: '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="10" height="10" rx="2.5"/><path d="M7 4.8v4.4M4.8 7h4.4"/></svg>',
    Bug: '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="4" y="4" width="6" height="8" rx="3"/><path d="M2 6h2M10 6h2M2 10h2M10 10h2M5 3l1 1M9 3L8 4"/></svg>',
    Idea: '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5 10.5h4M5.5 12.5h3M7 1.5a4 4 0 0 0-2.3 7.3c.3.2.3.5.3.7v1h4v-1c0-.2 0-.5.3-.7A4 4 0 0 0 7 1.5z"/></svg>',
    panel: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg>',
    search: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>',
    plus: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
    home: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 7L8 2.5 13.5 7v6.5h-11z"/></svg>',
    chev: '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 2l3 3-3 3"/></svg>',
    down: '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5l3 3 3-3"/></svg>',
    need: '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"><path d="M7 2.5v5M7 10.5v.5"/></svg>',
    play: '<svg width="11" height="11" viewBox="0 0 12 12" fill="#4ade80"><path d="M3 2l7 4-7 4z"/></svg>'
  };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var controls = document.getElementById('controls');
  OPTIONS.forEach(function (o) {
    var d = document.createElement('div'); d.className = 'ctl';
    d.innerHTML = '<span class="ctl-name">' + o.name + '</span><div class="seg" role="group" aria-label="' + o.name + '">' +
      o.values.map(function (v) { return '<button type="button" id="opt-' + o.key + '-' + v[0] + '" data-k="' + o.key + '" data-v="' + v[0] + '">' + v[1] + '</button>'; }).join('') + '</div>';
    controls.appendChild(d);
  });
  controls.addEventListener('click', function (e) { var b = e.target.closest('button[data-k]'); if (!b) return; cfg[b.dataset.k] = b.dataset.v; render(); });

  var stage = document.getElementById('stage'), box = document.getElementById('stageBox');
  function fit() { var s = box.clientWidth / 1280; stage.style.transform = 'scale(' + s + ')'; box.style.height = (860 * s) + 'px'; stage.dataset.scale = s; }
  window.addEventListener('resize', fit);

  function counts() {
    var c = { open: 0, rotting: 0, closed: 0 };
    LOOPS.forEach(function (l) { c[l.s === 'closed' ? 'closed' : l.s === 'rotting' ? 'rotting' : 'open']++; });
    c.remaining = c.open + c.rotting; return c;
  }
  function visible() {
    return LOOPS.map(function (l, i) { return { l: l, i: i }; }).filter(function (x) {
      var l = x.l, f = filter;
      if (f.status !== 'all' && l.s !== f.status) return false;
      var anyKind = Object.keys(f.kinds).filter(function (k) { return f.kinds[k]; });
      if (anyKind.length && anyKind.indexOf(l.k) < 0) return false;
      if (f.project && l.p !== f.project) return false;
      return true;
    });
  }

  function statusIcon(s) {
    if (s === 'closed') return '<span class="st"><span class="st-closed">' + I.tick + '</span></span>';
    if (s === 'rotting') return '<span class="st"><span class="st-rot">' + I.clock + '</span></span>';
    return '<span class="st"><span class="st-open"></span></span>';
  }
  function kindChip(k) { return '<span class="kind">' + (cfg.kindIcons === 'icons' ? I[k] : '') + k + '</span>'; }
  function details(l) {
    var note = '<span class="note">' + esc(l.note) + '</span>';
    if (cfg.opened === 'box') return '<div class="det box"><div>' + kindChip(l.k) + '</div>' + note + '</div>';
    if (cfg.opened === 'chip') return '<div class="det chip">' + kindChip(l.k) + note + '</div>';
    if (cfg.opened === 'grid') return '<div class="det grid"><span class="k">Kind</span><span>' + kindChip(l.k) + '</span><span class="k">Note</span><span class="v">' + esc(l.note) + '</span></div>';
    return '<div class="det plain">' + note + '</div>';
  }
  function fracOf(l) {
    if (!l.subs) return cfg.shape === 'table' ? '<span></span>' : '';
    var done = l.subs.filter(function (s) { return s.s === 'closed'; }).length;
    return '<span class="frac">' + done + '/' + l.subs.length + '</span>';
  }
  function topRow(l, id, isOpen) {
    var cls = 'row' + (l.s === 'closed' ? ' closed' : '') + (isOpen ? ' open-row' : '');
    var chipOnRow = cfg.opened === 'rowChip' && isOpen ? kindChip(l.k) : '';
    var pcol = '<span class="pname" style="color:' + P[l.p] + '">' + esc(l.p) + '</span>';
    if (cfg.shape === 'table') {
      return '<button type="button" class="' + cls + ' tr" data-i="' + id + '">' + statusIcon(l.s) + '<span class="t1">' + esc(l.t) + '</span>' + pcol + fracOf(l) +
        '<span class="tkind">' + (cfg.kindIcons === 'icons' ? I[l.k] : '') + l.k + '</span><span class="when">' + l.when + '</span></button>';
    }
    if (cfg.shape === 'tile') {
      return '<button type="button" class="' + cls + '" data-i="' + id + '" style="min-height:42px"><span class="ptile" style="background:' + P[l.p] + '">' + l.p[0].toUpperCase() + '</span>' +
        '<span class="t1">' + esc(l.t) + '</span>' + chipOnRow + fracOf(l) + '<span class="when">' + l.when + '</span>' + statusIcon(l.s) + '</button>';
    }
    if (cfg.shape === 'twoLine') {
      return '<button type="button" class="' + cls + ' two" data-i="' + id + '">' + statusIcon(l.s) + '<span class="tx"><span class="t1">' + esc(l.t) + '</span>' +
        '<span class="t2"><i style="background:' + P[l.p] + '"></i>' + esc(l.p) + '</span></span>' + chipOnRow + fracOf(l) + '<span class="when">' + l.when + '</span></button>';
    }
    return '<button type="button" class="' + cls + '" data-i="' + id + '">' + statusIcon(l.s) + '<span class="t1">' + esc(l.t) + '</span>' + chipOnRow + fracOf(l) + pcol + '<span class="when">' + l.when + '</span></button>';
  }
  function loopBlock(l, i) {
    var id = String(i), isOpen = !!opened[id], h = topRow(l, id, isOpen);
    if (!isOpen) return h;
    h += details(l);
    if (l.subs) h += '<div class="subs">' + l.subs.map(function (s, j) {
      var sid = id + '.' + j, so = !!opened[sid];
      var chip = cfg.opened === 'rowChip' && so ? kindChip(s.k) : '';
      return '<button type="button" class="row sub' + (s.s === 'closed' ? ' closed' : '') + (so ? ' open-row' : '') + '" data-i="' + sid + '">' + statusIcon(s.s) + '<span class="t1">' + esc(s.t) + '</span>' + chip + '<span class="when">' + s.when + '</span></button>' + (so ? details(s) : '');
    }).join('') + '</div>';
    return h;
  }

  function loopsColumn() {
    var c = counts(), total = c.remaining + c.closed;
    var count = '<div class="count"><div class="big"><b>' + c.remaining + '</b><span>remaining</span></div><span class="track"><i style="width:' + (c.closed / total * 100) + '%"></i></span>' +
      '<div class="split"><button type="button" data-f="open"><b>' + c.open + '</b>open</button><button type="button" data-f="rotting"><span class="rot-n">' + c.rotting + '</span>rotting</button><button type="button" data-f="closed"><b>' + c.closed + '</b>closed</button></div></div>';
    var st = [['all', 'All'], ['open', 'Open'], ['rotting', 'Rotting'], ['closed', 'Closed'], ['archived', 'Archived']];
    var filters = '<div class="filters"><div class="fseg">' + st.map(function (s) { return '<button type="button" data-fs="' + s[0] + '" class="' + (filter.status === s[0] ? 'on' : '') + '">' + s[1] + '</button>'; }).join('') + '</div>' +
      '<div class="fseg">' + ['Feature', 'Bug', 'Idea'].map(function (k) { return '<button type="button" data-fk="' + k + '" class="' + (filter.kinds[k] ? 'on' : '') + '">' + (cfg.kindIcons === 'icons' ? I[k] : '') + k + '</button>'; }).join('') + '</div>' +
      '<span class="fgrow"></span><button type="button" class="fbtn' + (filter.project ? ' on' : '') + '" data-act="project">' + (filter.project ? esc(filter.project) : 'Project') + I.down + '</button></div>';
    var list = visible();
    var head = cfg.shape === 'table' ? '<div class="thead"><span></span><span>Loop</span><span>Project</span><span>Subs</span><span>Kind</span><span>Age</span></div>' : '';
    var rows = list.length ? head + '<div class="rows">' + list.map(function (x) { return loopBlock(x.l, x.i); }).join('') + '</div>' : '<div class="empty">' + (filter.status === 'archived' ? 'Nothing archived' : 'No loops') + '</div>';
    return '<div class="colm"><div><div class="lbl">Loops</div>' + count + '</div>' + filters + '<div>' + rows + '</div></div>';
  }

  function render() {
    var head = '<div><h1 class="date">Saturday, 14 November</h1><div class="tot"><span class="sig">' + I.need + '2</span><span class="sig">' + I.play + '1</span></div><div class="lasthere">Last here 2d ago</div></div>';
    var pinned = '<div><div class="lbl">Pinned</div><div class="cards">' + ['afterterm', 'minimi-windows'].map(function (p, n) {
      return '<div class="cd"><div class="hd"><span class="pic" style="background:' + P[p] + ';width:24px;height:24px;font-size:11px">' + p[0].toUpperCase() + '</span><span>' + p + '</span></div><div class="f"><span>' + (n ? '2 threads' : '6 threads') + '</span><span class="ago">' + (n ? '5h' : '2m') + '</span></div></div>';
    }).join('') + '</div></div>';
    var plist = [['afterthought', '1d'], ['canvas-agent', '2d'], ['transcript-fetcher-clone', '2d'], ['aftertales', '6d'], ['General', '1w'], ['minimi-docs', '2w']];
    var projects = '<div><div class="lbl">Projects</div><div class="plist ' + cfg.projects + '">' + plist.map(function (p) {
      var col = P[p[0]] || '#7c8aa0';
      return '<div class="pr"><span class="pic" style="background:' + col + '">' + p[0][0].toUpperCase() + '</span><span class="n">' + p[0] + '</span><span class="t">' + p[1] + '</span></div>';
    }).join('') + '</div><div class="more">Show more</div></div>';
    var side = '<div class="colm">' + head + pinned + projects + '</div>';
    var inner = cfg.position === 'right' ? '<div class="home loops-right">' + side + loopsColumn() + '</div>' : '<div class="home loops-left">' + loopsColumn() + side + '</div>';
    var rail = '<span class="rail-btn">' + I.panel + '</span><span class="rail-btn">' + I.search + '</span><span class="rail-btn">' + I.plus + '</span><span class="rail-sep"></span><span class="rail-btn on">' + I.home + '</span><span class="rail-sep"></span>' +
      ['afterterm', 'minimi-windows'].map(function (p) { return '<span class="tile" style="background:' + P[p] + '">' + p[0].toUpperCase() + '</span>'; }).join('');
    var keep = stage.querySelector('.screen'), top = keep ? keep.scrollTop : 0;
    stage.innerHTML = '<div class="titlebar"><span class="name">afterterm</span><span>0.16.0</span><span class="grow"></span><span class="caps"><span>—</span><span>☐</span><span>✕</span></span></div>' +
      '<div class="body"><div class="rail">' + rail + '</div><div class="screen">' + inner + '</div></div>';
    var sc = stage.querySelector('.screen'); if (sc) sc.scrollTop = top;
    controls.querySelectorAll('button[data-k]').forEach(function (b) { b.setAttribute('aria-pressed', String(cfg[b.dataset.k] === b.dataset.v)); });
    document.getElementById('cfgOut').textContent = JSON.stringify(cfg, null, 2);
    try { localStorage.setItem('loops-home2-cfg', JSON.stringify(cfg)); } catch (e) {}
    fit();
  }

  function toast(text) {
    var old = stage.querySelector('.toast'); if (old) old.remove();
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = text; stage.appendChild(t);
    setTimeout(function () { t.remove(); }, 1400);
  }

  /* menus: a loop's right-click menu, and the project filter */
  var menuFor = null;
  function closeMenu(from) { stage.querySelectorAll('.menu').forEach(function (m) { if (!from || +m.dataset.level >= from) m.remove(); }); }
  function loopMenu(target) {
    var l = target.loop, st = target.item.s, sub = target.sub;
    var update = [
      { label: 'Status', kids: [{ id: 'status', label: 'Open', check: st !== 'closed' }, { id: 'status', label: 'Closed', check: st === 'closed' }] },
      { label: 'Kind', kids: ['Feature', 'Bug', 'Idea'].map(function (k) { return { id: 'kind', label: k, check: target.item.k === k }; }) },
      { id: 'rename', label: 'Rename' }
    ];
    if (!sub) update.push({ label: 'Move to project', kids: Object.keys(P).map(function (p) { return { id: 'move', label: p, check: p === l.p }; }) });
    update.push({ id: 'archive', label: 'Archive' }, 'sep', { id: 'delete', label: 'Delete', danger: true });
    return [{ id: 'open', label: 'Open chat' }, { id: 'close', label: st === 'closed' ? 'Reopen' : 'Close' }, 'sep', { label: 'Update', kids: update }];
  }
  function showMenu(items, x, y, level) {
    closeMenu(level);
    var menu = document.createElement('div'); menu.className = 'menu'; menu.dataset.level = level;
    items.forEach(function (it) {
      if (it === 'sep') { var s = document.createElement('span'); s.className = 'sep'; menu.appendChild(s); return; }
      var b = document.createElement('button'); b.type = 'button'; if (it.danger) b.className = 'danger';
      b.innerHTML = (it.check !== undefined ? '<span class="chk">' + (it.check ? '✓' : '') + '</span>' : '') + '<span class="lbl2">' + esc(it.label) + '</span>' + (it.kids ? '<span class="chev">' + I.chev + '</span>' : '');
      function openKids() {
        menu.querySelectorAll('button').forEach(function (x) { x.classList.remove('hl'); });
        if (!it.kids) { closeMenu(level + 1); return; }
        b.classList.add('hl');
        var sc = parseFloat(stage.dataset.scale) || 1, r = stage.getBoundingClientRect(), br = b.getBoundingClientRect(), mr = menu.getBoundingClientRect();
        var nx = (mr.right - r.left) / sc + 2, ny = (br.top - r.top) / sc - 5;
        if (nx + 180 > 1280) nx = (mr.left - r.left) / sc - 182;
        showMenu(it.kids, nx, Math.min(ny, 860 - (it.kids.length * 32 + 12)), level + 1);
      }
      b.addEventListener('mouseenter', openKids);
      b.addEventListener('click', function (e) { e.stopPropagation(); if (it.kids) { openKids(); return; } act(it); });
      menu.appendChild(b);
    });
    menu.style.left = x + 'px'; menu.style.top = y + 'px';
    stage.appendChild(menu);
  }
  function act(it) {
    closeMenu();
    if (it.id === 'pf') { filter.project = it.label === 'Every project' ? null : it.label; render(); return; }
    var target = menuFor; if (!target) return;
    var l = target.loop, item = target.item;
    if (it.id === 'open') return toast('Opens the chat');
    if (it.id === 'close') { item.s = item.s === 'closed' ? 'open' : 'closed'; render(); return; }
    if (it.id === 'status') { item.s = it.label === 'Closed' ? 'closed' : 'open'; render(); return; }
    if (it.id === 'kind') { item.k = it.label; render(); return; }
    if (it.id === 'move') { l.p = it.label; render(); return; }
    toast(({ rename: 'Rename', archive: 'Archived', 'delete': 'Deleted' })[it.id] || it.label);
  }
  function findTarget(id) {
    var parts = String(id).split('.'), l = LOOPS[+parts[0]]; if (!l) return null;
    var sub = parts.length > 1 ? l.subs[+parts[1]] : null;
    return { loop: l, item: sub || l, sub: !!sub };
  }
  function stagePoint(e) { var sc = parseFloat(stage.dataset.scale) || 1, r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / sc, y: (e.clientY - r.top) / sc }; }
  stage.addEventListener('contextmenu', function (e) {
    var row = e.target.closest('[data-i]'); if (!row) return;
    e.preventDefault();
    menuFor = findTarget(row.dataset.i); if (!menuFor) return;
    var p = stagePoint(e);
    showMenu(loopMenu(menuFor), Math.min(p.x, 1280 - 360), Math.min(p.y, 860 - 140), 0);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
  document.addEventListener('click', function (e) { if (!e.target.closest('.menu') && !e.target.closest('[data-act="project"]')) closeMenu(); });

  stage.addEventListener('click', function (e) {
    if (e.target.closest('.menu')) return;
    var b = e.target.closest('[data-act], [data-i], [data-f], [data-fs], [data-fk]'); if (!b) return;
    if (b.dataset.f) { filter.status = filter.status === b.dataset.f ? 'all' : b.dataset.f; render(); return; }
    if (b.dataset.fs) { filter.status = b.dataset.fs; render(); return; }
    if (b.dataset.fk) { filter.kinds[b.dataset.fk] = !filter.kinds[b.dataset.fk]; render(); return; }
    if (b.dataset.act === 'project') {
      var r = b.getBoundingClientRect(), sr = stage.getBoundingClientRect(), sc = parseFloat(stage.dataset.scale) || 1;
      var items = [{ id: 'pf', label: 'Every project', check: !filter.project }, 'sep'].concat(Object.keys(P).map(function (p) { return { id: 'pf', label: p, check: filter.project === p }; }));
      showMenu(items, Math.min((r.left - sr.left) / sc, 1280 - 200), (r.bottom - sr.top) / sc + 4, 0);
      return;
    }
    if (b.dataset.i !== undefined) { opened[b.dataset.i] = !opened[b.dataset.i]; render(); }
  });

  var copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', function () {
    var txt = document.getElementById('cfgOut').textContent;
    function done() { copyBtn.textContent = 'Copied'; setTimeout(function () { copyBtn.textContent = 'Copy config'; }, 1200); }
    function fallback() { var rg = document.createRange(); rg.selectNodeContents(document.getElementById('cfgOut')); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); }
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  });

  render();
})();
</script>
