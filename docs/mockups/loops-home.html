<title>Loops on Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a control bar, then afterterm's Home as it is today, drawn at 1280x860 and scaled to fit, with a resizable loops column beside Pinned and Projects. Single dark look, like the app. Solid colours only: no tinted washes. */
:root {
  color-scheme: dark;
  --bg: #212121; --pane: #191919; --side: #171717; --hover: #2f2f2f; --hover2: #383838; --raise: #2f2f2f; --line: #2a2a2a;
  --text: #ececec; --text2: #b4b4b4; --text3: #8e8e8e; --text4: #5c5c5c;
  --btn: #ececec; --btn-text: #0d0d0d;
  --green: #4ade80; --green-ink: #06170b;
  --rot: #e8a23a; --ink: #141414; --need: #fbbf24;
  --chip: #3a3a3a; --boxbg: #2a2a2a;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Cascadia Code', 'Cascadia Mono', Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { background: var(--side); color: var(--text); }
body { font-family: var(--sans); font-size: 14px; line-height: 1.45; margin: 0; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }

.wrap { padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; max-width: 1400px; margin: 0 auto; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-start; }
.ctl { display: grid; gap: 6px; min-width: 0; }
.ctl-name { font-size: 11px; color: var(--text3); letter-spacing: .04em; text-transform: uppercase; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--pane); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { background: none; border: 0; border-radius: 7px; padding: 5px 10px; font-size: 13px; color: var(--text2); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--text); background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); }

.stage-box { position: relative; width: 100%; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); }
.stage { position: absolute; left: 0; top: 0; width: 1280px; height: 860px; transform-origin: 0 0; background: var(--side); display: grid; grid-template-rows: 32px 1fr; overflow: hidden; }
.titlebar { display: flex; align-items: center; gap: 8px; padding-left: 14px; font-size: 12px; color: var(--text2); }
.titlebar .ver { background: var(--hover); color: var(--text3); border-radius: 5px; padding: 1px 6px; font-size: 11px; }
.titlebar .grow { flex: 1; }
.caps { display: flex; height: 100%; color: var(--text3); }
.caps span { width: 46px; display: grid; place-items: center; }
.body { display: grid; grid-template-columns: 76px 1fr; min-height: 0; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 10px; }
.rail-btn { width: 40px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--text3); }
.rail-pill { background: #101010; border-radius: 12px; padding: 3px; display: grid; gap: 2px; }
.rail-pill .on { background: var(--hover2); color: var(--text); }
.rail-sep { width: 32px; height: 1px; background: var(--line); }
.rtile { position: relative; width: 36px; height: 36px; border-radius: 10px; background: var(--hover); display: grid; place-items: center; }
.rbadge { position: absolute; right: -14px; top: 2px; display: grid; gap: 2px; }
.rbadge span { width: 16px; height: 16px; border-radius: 50%; background: #d4a24c; color: #1a1206; font-size: 10px; font-weight: 600; display: grid; place-items: center; }

.screen { position: relative; background: var(--bg); border-radius: 16px 0 0 0; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #444 transparent; }
.home { margin: 0 auto; padding: 32px 28px 60px; display: grid; align-items: start; }
.home.single { max-width: 680px; }
.colm { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.date { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -.01em; }
.tot { display: flex; gap: 6px; margin-top: 12px; }
.sig { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--hover); font-size: 12.5px; color: var(--text2); }
.lasthere { color: var(--text3); font-size: 12.5px; margin-top: 10px; }
.lbl { font-size: 13.5px; color: var(--text3); margin: 0 12px 12px; display: flex; align-items: center; gap: 8px; }
.lbl .grow { flex: 1; }
.lbl .ibtn { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--text3); border: 0; background: none; cursor: pointer; }
.lbl .ibtn:hover { background: var(--hover); color: var(--text); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cd { background: var(--raise); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 92px; }
.cd .hd { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; min-width: 0; }
.cd .hd .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd .hd .pin { color: var(--text2); }
.cd .f { display: flex; align-items: center; color: var(--text3); font-size: 13px; margin-top: auto; }
.cd .f .ago { margin-left: auto; }
.gl { display: grid; place-items: center; flex: none; }
.cd .sig { background: var(--hover2); height: 22px; }

/* projects list variants */
.plist.today { display: flex; flex-direction: column; }
.plist.today .pr { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; font-weight: 500; }
.plist.today .pr .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist.today .pr .t { color: var(--text3); font-size: 13px; font-weight: 400; margin-right: 80px; }
.plist.two, .plist.three { display: grid; gap: 4px 12px; }
.plist.two { grid-template-columns: 1fr 1fr; }
.plist.three { grid-template-columns: 1fr 1fr 1fr; }
.plist.two .pr, .plist.three .pr { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; font-weight: 500; font-size: 13.5px; min-width: 0; }
.plist.two .pr .n, .plist.three .pr .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist.two .pr .t, .plist.three .pr .t { color: var(--text3); font-size: 12.5px; font-weight: 400; }
.plist.three .pr .t { display: none; }
.plist.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px; }
.plist.chips .pr { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--raise); font-size: 13px; font-weight: 500; }
.plist.chips .pr .t { display: none; }
.plist.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.plist.tiles .pr { display: grid; justify-items: center; gap: 8px; padding: 14px 6px 10px; border-radius: 12px; background: var(--raise); font-size: 12.5px; font-weight: 500; text-align: center; min-width: 0; }
.plist.tiles .pr .n { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist.tiles .pr .t { display: none; }
.pr:hover { background: var(--hover); }
.plist.chips .pr:hover, .plist.tiles .pr:hover { background: var(--hover2); }
.more { color: var(--text3); padding: 8px 12px; font-size: 13.5px; }

/* the handle between the columns */
.handle { position: relative; cursor: col-resize; align-self: stretch; }
.handle::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; border-radius: 1px; background: transparent; transition: background .15s; }
.handle:hover::after, .handle.drag::after { background: #5a5a5a; }
.reopen { position: absolute; top: 20px; right: 24px; height: 30px; border-radius: 8px; border: 0; background: var(--raise); color: var(--text2); display: inline-flex; align-items: center; gap: 7px; padding: 0 11px; font-size: 12.5px; cursor: pointer; }
.reopen:hover { background: var(--hover2); color: var(--text); }
.reopen b { color: var(--text); font-weight: 500; }

/* count card */
.count { background: var(--raise); border-radius: 16px; padding: 16px 18px; display: grid; gap: 12px; }
.count .big { display: flex; align-items: baseline; gap: 8px; }
.count .big b { font-size: 30px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.count .big span { color: var(--text2); }
.track { height: 6px; border-radius: 3px; background: #474747; overflow: hidden; display: block; }
.track i { display: block; height: 100%; background: var(--green); }
.split { display: flex; gap: 4px; flex-wrap: wrap; margin-left: -8px; }
.split button { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px; border-radius: 8px; border: 0; background: none; color: var(--text2); font-size: 13px; cursor: pointer; }
.split button:hover { background: var(--hover2); color: var(--text); }
.split button.on { background: var(--btn); color: var(--btn-text); }
.split button.on b { color: var(--btn-text); }
.split b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.rot-n { min-width: 20px; height: 20px; border-radius: 10px; background: var(--rot); color: var(--ink); font-weight: 600; display: grid; place-items: center; padding: 0 6px; font-size: 12px; font-variant-numeric: tabular-nums; }

/* filters, four looks */
.filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 28px; }
.fgrow { flex: 1; }
.ftab { border: 0; background: none; padding: 3px 6px; font-size: 12.5px; color: var(--text3); cursor: pointer; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; }
.ftab:hover { color: var(--text); }
.ftab.on { color: var(--text); font-weight: 500; }
.fdot { width: 3px; height: 3px; border-radius: 50%; background: var(--text4); margin: 0 4px; }
.ficon { border: 0; background: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--text3); cursor: pointer; }
.ficon:hover { color: var(--text); background: var(--hover); }
.ficon.on { background: var(--btn); color: var(--btn-text); }
.fdrop { border: 0; background: var(--hover); height: 26px; padding: 0 9px; border-radius: 7px; font-size: 12.5px; color: var(--text2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.fdrop:hover { background: var(--hover2); color: var(--text); }
.fdrop b { color: var(--text); font-weight: 500; }
.fchip { border: 0; background: var(--btn); color: var(--btn-text); height: 24px; padding: 0 6px 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.fseg { display: inline-flex; background: var(--pane); border-radius: 8px; padding: 2px; gap: 1px; }
.fseg button { border: 0; background: none; border-radius: 6px; height: 22px; padding: 0 8px; font-size: 12px; color: var(--text3); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.fseg button:hover { color: var(--text); }
.fseg button.on { background: var(--hover2); color: var(--text); }

/* rows */
.rows { display: flex; flex-direction: column; gap: 1px; }
.row { display: flex; align-items: center; gap: 10px; padding: 0 10px; min-height: 38px; border-radius: 10px; cursor: pointer; min-width: 0; border: 0; background: none; text-align: left; width: 100%; color: var(--text); flex: none; }
.row:hover, .row.open-row { background: var(--hover); }
.row .t1 { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.closed .t1 { color: var(--text3); }
.row.sub { min-height: 32px; }
.row.sub .t1 { font-size: 13px; }
.pname { font-size: 12.5px; white-space: nowrap; flex: none; max-width: 32%; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 6px; color: var(--text2); }
.when { font-size: 12.5px; color: var(--text3); flex: none; width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.st { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
.st-open { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--text3); }
.st-closed { width: 15px; height: 15px; border-radius: 50%; background: var(--green); display: grid; place-items: center; color: var(--green-ink); }
.st-rot { width: 15px; height: 15px; border-radius: 50%; background: var(--rot); display: grid; place-items: center; color: var(--ink); }
.frac { font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums; flex: none; padding: 2px 5px; border-radius: 5px; }
.frac:hover { background: #444; color: var(--text); }
.det { margin: 4px 10px 8px 36px; background: var(--boxbg); border-radius: 10px; padding: 9px 10px; display: flex; align-items: flex-start; gap: 10px; }
.det .note { font-size: 13px; color: var(--text2); padding-top: 2px; min-width: 0; }
.label { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--chip); color: var(--text); font-size: 12px; flex: none; }
.subs { display: flex; flex-direction: column; gap: 1px; margin-left: 26px; }
.subs .det { margin-left: 36px; }
.empty { color: var(--text3); font-size: 13px; padding: 24px 10px; text-align: center; }

.menu { position: absolute; z-index: 30; min-width: 176px; background: #2f2f2f; border: 1px solid #3d3d3d; border-radius: 10px; padding: 4px; box-shadow: 0 10px 28px #000; display: flex; flex-direction: column; }
.menu button { border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 7px; font-size: 13px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; }
.menu button .lbl2 { flex: 1; }
.menu button .chev { color: var(--text3); }
.menu button .chk { width: 12px; }
.menu button:hover, .menu button.hl { background: #3d3d3d; }
.menu .sep { height: 1px; background: #3d3d3d; margin: 4px 6px; }
.menu .head { font-size: 11.5px; color: var(--text3); padding: 6px 10px 2px; }
.menu .danger { color: #f87171; }
.toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--btn); color: var(--btn-text); font-size: 13px; padding: 7px 14px; border-radius: 999px; z-index: 40; }

.cfg { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.cfg pre { margin: 0; flex: 1; min-width: 0; background: var(--pane); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: 12px; color: var(--text2); overflow-x: auto; white-space: pre; }
.copy { border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-text); padding: 0 18px; font-size: 13px; font-weight: 500; cursor: pointer; min-height: 40px; }
</style>

<div class="wrap">

</div>

    menuFor = findTarget(row.dataset.i); if (!menuFor) return;
    var sc = scale(), r = stage.getBoundingClientRect();
    showMenu(loopMenu(menuFor), Math.min((e.clientX - r.left) / sc, 1280 - 360), Math.min((e.clientY - r.top) / sc, 860 - 140), 0);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
  document.addEventListener('click', function (e) { if (!e.target.closest('.menu') && !e.target.closest('[data-act]')) closeMenu(); });

  stage.addEventListener('click', function (e) {
    if (e.target.closest('.menu')) return;
    var b = e.target.closest('[data-act], [data-i], [data-f], [data-fs], [data-fl], [data-clear]'); if (!b) return;
    var a = b.dataset.act;
    if (b.dataset.f) { filter.status = filter.status === b.dataset.f ? 'all' : b.dataset.f; render(); return; }
    if (b.dataset.fs) { filter.status = b.dataset.fs; render(); return; }
    if (b.dataset.fl) { filter.label = filter.label === b.dataset.fl ? null : b.dataset.fl; render(); return; }
    if (b.dataset.clear) { if (b.dataset.clear === 'status') filter.status = 'all'; else filter[b.dataset.clear] = null; render(); return; }
    if (a === 'collapse') { cfg.loopsCollapsed = true; render(); return; }
    if (a === 'expand') { cfg.loopsCollapsed = false; render(); return; }
    var p;
    if (a === 'status') { p = below(b); showMenu(statusItems(), p.x, p.y, 0); return; }
    if (a === 'label') { p = below(b); showMenu(labelItems(), p.x, p.y, 0); return; }
    if (a === 'project') { p = below(b); showMenu(projectItems(), p.x, p.y, 0); return; }
    if (a === 'all-filters') {
      p = below(b);
      showMenu([{ label: 'Status', kids: statusItems() }, { label: 'Label', kids: labelItems() }, { label: 'Project', kids: projectItems() }], p.x, p.y, 0);
      return;
    }
    if (b.dataset.i !== undefined) { opened[b.dataset.i] = !opened[b.dataset.i]; render(); }
  });

  var copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', function () {
    var txt = document.getElementById('cfgOut').textContent;
    function done() { copyBtn.textContent = 'Copied'; setTimeout(function () { copyBtn.textContent = 'Copy config'; }, 1200); }
    function fallback() { var rg = document.createRange(); rg.selectNodeContents(document.getElementById('cfgOut')); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); }
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  });

  render();
})();
</script>
