<title>Loops on Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a control bar, then afterterm's Home drawn at the real window size (1920x1028) and scaled to fit. Six layouts; none is taller than the window, and a section that overflows scrolls on its own. Single dark look, like the app. Solid colours only: no tinted washes. */
:root {
  color-scheme: dark;
  --bg: #212121; --pane: #191919; --side: #171717; --hover: #2f2f2f; --hover2: #383838; --raise: #2f2f2f; --panel: #262626; --line: #2a2a2a;
  --text: #ececec; --text2: #b4b4b4; --text3: #8e8e8e; --text4: #5c5c5c;
  --btn: #ececec; --btn-text: #0d0d0d;
  --green: #4ade80; --green-ink: #06170b;
  --rot: #e8a23a; --ink: #141414;
  --chip: #3a3a3a; --boxbg: #2a2a2a;
  --h0: #363636; --h1: #1f6b47; --h2: #2c9a62; --h3: #4ade80; --h4: #b9f6d0;
  --ease: cubic-bezier(.2,.8,.2,1);
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Cascadia Code', 'Cascadia Mono', Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { background: var(--side); color: var(--text); }
body { font-family: var(--sans); font-size: 14px; line-height: 1.45; margin: 0; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }

.wrap { padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; max-width: 1960px; margin: 0 auto; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-start; }
.ctl { display: grid; gap: 6px; min-width: 0; }
.ctl-name { font-size: 11px; color: var(--text3); letter-spacing: .04em; text-transform: uppercase; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--pane); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { background: none; border: 0; border-radius: 7px; padding: 5px 10px; font-size: 13px; color: var(--text2); cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--text); background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); }

.stage-box { position: relative; width: 100%; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); }
.stage-box:fullscreen { background: #000; border: 0; border-radius: 0; overflow: hidden; }
.taskbar { display: none; }
.stage-box:fullscreen .taskbar { display: flex; position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: #1c1c1c; border-top: 1px solid #2b2b2b; align-items: center; justify-content: center; gap: 8px; }
.taskbar span { width: 36px; height: 36px; border-radius: 6px; background: #2b2b2b; }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1028px; transform-origin: 0 0; background: var(--side); display: grid; grid-template-rows: 32px 1fr; overflow: hidden; }
.titlebar { display: flex; align-items: center; gap: 8px; padding-left: 14px; font-size: 12px; color: var(--text2); }
.titlebar .ver { background: var(--hover); color: var(--text3); border-radius: 5px; padding: 1px 6px; font-size: 11px; }
.titlebar .grow { flex: 1; }
.caps { display: flex; height: 100%; color: var(--text3); }
.caps span { width: 46px; display: grid; place-items: center; }
.body { display: grid; grid-template-columns: 76px 1fr; min-height: 0; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 10px; }
.rail-btn { width: 40px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--text3); }
.rail-pill { background: #101010; border-radius: 12px; padding: 3px; display: grid; gap: 2px; }
.rail-pill .on { background: var(--hover2); color: var(--text); }
.rail-sep { width: 32px; height: 1px; background: var(--line); }
.rtile { position: relative; width: 36px; height: 36px; border-radius: 10px; background: var(--hover); display: grid; place-items: center; }
.rbadge { position: absolute; right: -14px; top: 2px; display: grid; gap: 2px; }
.rbadge span { width: 16px; height: 16px; border-radius: 50%; background: #d4a24c; color: #1a1206; font-size: 10px; font-weight: 600; display: grid; place-items: center; }
.screen { position: relative; background: var(--bg); border-radius: 16px 0 0 0; overflow: hidden; min-height: 0; }

/* shared pieces */
.scroll { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #444 transparent; }
.hscroll { overflow-x: auto; scrollbar-width: thin; scrollbar-color: #444 transparent; }
.stack { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.date { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
.tot { display: flex; gap: 6px; margin-top: 12px; }
.sig { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--hover); font-size: 12.5px; color: var(--text2); }
.lasthere { color: var(--text3); font-size: 12.5px; margin-top: 10px; }
.lbl { font-size: 13.5px; color: var(--text3); margin: 0 12px 12px; display: flex; align-items: center; gap: 8px; }
.lbl .grow { flex: 1; }
.lbl .n { color: var(--text2); font-variant-numeric: tabular-nums; }
.ibtn { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--text3); border: 0; background: none; cursor: pointer; flex: none; }
.ibtn:hover { background: var(--hover); color: var(--text); }
.ibtn.on { background: var(--btn); color: var(--btn-text); }
.gl { display: grid; place-items: center; flex: none; }

.pins { display: grid; gap: 8px; }
.pins.c2 { grid-template-columns: 1fr 1fr; }
.pins .cd { background: var(--raise); border-radius: 12px; height: 50px; padding: 0 16px; display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; min-width: 0; }
.pins .cd .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pins .cd .ago { color: var(--text3); font-size: 13px; font-weight: 400; }
.pins .cd .sig { background: var(--hover2); height: 20px; padding: 0 7px; font-size: 12px; font-weight: 400; }
.pins.strip { display: flex; gap: 8px; }
.pins.tall { gap: 12px; }
.pins.tall .cd { height: auto; min-height: 92px; padding: 16px; border-radius: 16px; flex-direction: column; align-items: stretch; gap: 14px; }
.pins.tall .cd .hd { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; min-width: 0; }
.pins.tall .cd .pin { color: var(--text2); display: grid; }
.pins.tall .cd .f { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.pins.tall .cd .f .ago { margin-left: auto; font-size: 13px; }
.pins.tall .cd .sig { background: var(--hover2); height: 24px; padding: 0 9px; font-size: 12.5px; color: var(--text2); gap: 6px; }
.pins.strip .cd { width: 220px; flex: none; }
.plist { display: grid; gap: 2px 12px; }
.plist.c2 { grid-template-columns: 1fr 1fr; }
.plist .pr { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; font-weight: 500; font-size: 14px; min-width: 0; }
.plist .pr:hover { background: var(--hover); }
.plist .pr .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist .pr .t { color: var(--text3); font-size: 13px; font-weight: 400; }
.plist.chips { display: flex; gap: 6px; }
.plist.chips .pr { flex: none; background: var(--raise); border-radius: 999px; height: 32px; padding: 0 12px; }
.plist.chips .pr .t { display: none; }
.more { color: var(--text3); padding: 10px 14px; font-size: 14px; border: 0; background: none; border-radius: 10px; cursor: pointer; text-align: left; }
.more:hover { background: var(--hover); color: var(--text); }

.count { background: var(--raise); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; }
.count .big { display: flex; align-items: baseline; gap: 8px; }
.count .big b { font-size: 28px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.count .big span { color: var(--text2); }
.track { height: 6px; border-radius: 3px; background: #474747; overflow: hidden; display: block; }
.track i { display: block; height: 100%; background: var(--green); }
.split { display: flex; gap: 4px; flex-wrap: wrap; margin-left: -8px; }
.split button { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px; border-radius: 8px; border: 0; background: none; color: var(--text2); font-size: 13px; cursor: pointer; transition: background .15s, color .15s; }
.split button:hover { background: var(--hover2); color: var(--text); }
.split button.on { background: var(--btn); color: var(--btn-text); }
.split button.on b { color: var(--btn-text); }
.split b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.rot-n { min-width: 20px; height: 20px; border-radius: 10px; background: var(--rot); color: var(--ink); font-weight: 600; display: grid; place-items: center; padding: 0 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
.count.wide { grid-template-columns: auto 1fr; align-items: center; column-gap: 22px; }
.count.wide .track { grid-column: 1 / -1; }

/* filters: an icon, the segments open in the same row */
.fbar { display: flex; align-items: center; gap: 6px; min-height: 28px; flex-wrap: nowrap; min-width: 0; }
.fchip { border: 0; background: var(--btn); color: var(--btn-text); height: 24px; padding: 0 6px 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; animation: pop .22s var(--ease); flex: none; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.finline { display: inline-flex; align-items: center; gap: 6px; max-width: 0; opacity: 0; overflow: hidden; transition: max-width .32s var(--ease), opacity .2s; }
.finline.open { max-width: 640px; opacity: 1; }
.fseg { position: relative; display: inline-flex; background: var(--pane); border-radius: 8px; padding: 2px; gap: 1px; flex: none; }
.fseg .thumb { position: absolute; top: 2px; bottom: 2px; left: 0; border-radius: 6px; background: var(--hover2); transition: transform .24s var(--ease), width .24s var(--ease); pointer-events: none; }
.fseg button { position: relative; border: 0; background: none; border-radius: 6px; height: 22px; padding: 0 8px; font-size: 12px; color: var(--text3); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: color .15s; white-space: nowrap; }
.fseg button:hover, .fseg button.on { color: var(--text); }
.fdrop { border: 0; background: var(--pane); height: 26px; padding: 0 9px; border-radius: 8px; font-size: 12px; color: var(--text3); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; }
.fdrop:hover, .fdrop.on { color: var(--text); }

.rows { display: flex; flex-direction: column; gap: 1px; }
.row { display: flex; align-items: center; gap: 10px; padding: 0 10px; min-height: 38px; border-radius: 10px; cursor: pointer; min-width: 0; border: 0; background: none; text-align: left; width: 100%; color: var(--text); flex: none; }
.row:hover, .row.open-row { background: var(--hover); }
.row .t1 { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.closed .t1 { color: var(--text3); }
.row.sub { min-height: 32px; }
.row.sub .t1 { font-size: 13px; }
.pname { font-size: 12.5px; white-space: nowrap; flex: none; max-width: 34%; overflow: hidden; text-overflow: ellipsis; }
.when { font-size: 12.5px; color: var(--text3); flex: none; width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.st { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
.st-open { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--text3); }
.st-closed { width: 15px; height: 15px; border-radius: 50%; background: var(--green); display: grid; place-items: center; color: var(--green-ink); }
.st-rot { width: 15px; height: 15px; border-radius: 50%; background: var(--rot); display: grid; place-items: center; color: var(--ink); }
.frac { font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums; flex: none; padding: 2px 5px; border-radius: 5px; }
.det { margin: 4px 10px 8px 36px; background: var(--boxbg); border-radius: 10px; padding: 9px 10px; display: flex; align-items: flex-start; gap: 10px; }
.det .note { font-size: 13px; color: var(--text2); padding-top: 2px; min-width: 0; }
.det .dtx { display: grid; gap: 5px; min-width: 0; padding-top: 2px; }
.det .desc { font-size: 13px; color: var(--text); }
.det .stn { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text3); min-width: 0; }
.det { display: block !important; }
.det .stn { align-items: flex-start !important; line-height: 1.45; }
.det .stn svg { flex: none; margin-top: 2px; }
.det .dtx { gap: 6px !important; }
.det .desc { line-height: 1.45; }
.row .kind { display: grid; place-items: center; color: var(--text3); flex: none; }
.row.closed .kind { color: var(--text4); }
.det .stn .ago { flex: none; }
.det .stn .ago::before { content: '\00b7'; margin-right: 6px; }
.label { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--chip); color: var(--text); font-size: 12px; flex: none; }
.subs { display: flex; flex-direction: column; gap: 1px; margin-left: 26px; }
.subs .det { margin-left: 36px; }
.empty { color: var(--text3); font-size: 13px; padding: 24px 10px; text-align: center; }
.enter { animation: enter .3s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }

.act { background: var(--raise); border-radius: 16px; padding: 14px 16px 12px; display: grid; gap: 10px; }
.act-h { display: flex; align-items: center; gap: 10px; }
.act-h b { font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
.act-h .grow { flex: 1; }
.act-h .long { font-size: 12px; color: var(--text3); }
.act-h .long b { font-size: 12px; color: var(--text); }
.nav { border: 0; background: none; color: var(--text3); width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; cursor: pointer; padding: 0; }
.nav:hover { background: var(--hover2); color: var(--text); }
.nav.off { opacity: .3; pointer-events: none; }
.hm { display: grid; gap: 3px; align-items: center; justify-content: start; }
.hm .dl { font-size: 10.5px; color: var(--text3); }
.hm .mo { font-size: 11.5px; color: var(--text3); white-space: nowrap; width: 12px; overflow: visible; }
.cell { width: 12px; height: 12px; border-radius: 3px; background: var(--h0); }
.cell.l1 { background: var(--h1); } .cell.l2 { background: var(--h2); } .cell.l3 { background: var(--h3); } .cell.l4 { background: var(--h4); }
.cell.cur { outline: 1px solid #6e6e6e; outline-offset: 1px; }
.legend { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text3); }
.legend .cell { width: 11px; height: 11px; }
.legend .grow { flex: 1; }
.legend .curkey { width: 11px; height: 11px; border-radius: 3px; outline: 1px solid #6e6e6e; outline-offset: 1px; margin-right: 4px; }

/* layouts: the page itself never scrolls */
.lay { height: 100%; min-height: 0; display: grid; position: relative; }
.lay.prog { transition: grid-template-columns .34s var(--ease), column-gap .34s var(--ease); }
.reopen { position: absolute; top: 28px; right: 32px; height: 30px; border-radius: 8px; border: 0; background: var(--raise); color: var(--text2); display: inline-flex; align-items: center; gap: 7px; padding: 0 11px; font-size: 12.5px; cursor: pointer; z-index: 3; animation: pop .22s var(--ease); }
.reopen:hover { background: var(--hover2); color: var(--text); }
.reopen b { color: var(--text); font-weight: 500; }
.psearch { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 26px; width: 190px; padding: 0 9px; border-radius: 7px; background: #262626; color: var(--text3); cursor: text; transition: background .15s; }
.psearch:hover, .psearch:focus-within { background: #2a2a2a; }
.psearch:focus-within { color: var(--text2); }
.psearch .dots { position: absolute; left: 29px; top: 0; bottom: 0; display: none; align-items: center; padding-right: 1px; background: inherit; color: var(--text2); font-size: 13px; pointer-events: none; }
.psearch.over .dots { display: flex; }
.psearch input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--text); font: inherit; font-size: 13px; padding: 0; }
.psearch input::placeholder { color: var(--text3); }
.handle { position: relative; cursor: col-resize; }
.handle::after { content: ""; position: absolute; top: 24px; bottom: 24px; left: 50%; width: 2px; margin-left: -1px; border-radius: 1px; background: transparent; transition: background .15s; }
.handle:hover::after, .handle.drag::after { background: #5a5a5a; }
.loopscol { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.loopscol .list { flex: 1; min-height: 0; margin-right: -8px; padding-right: 8px; }
.panel { background: var(--panel); border-radius: 18px; padding: 18px; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; min-height: 0; }
.bcol { background: var(--panel); border-radius: 16px; padding: 12px 8px 8px; display: flex; flex-direction: column; min-height: 0; }
.bcol .bh { display: flex; align-items: center; gap: 8px; padding: 0 8px 10px; font-size: 13.5px; font-weight: 500; }
.bcol .bh .n { color: var(--text3); font-weight: 400; }

.menu { position: absolute; z-index: 30; min-width: 176px; background: #2f2f2f; border: 1px solid #3d3d3d; border-radius: 10px; padding: 4px; box-shadow: 0 10px 28px #000; display: flex; flex-direction: column; }
.menu button { border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 7px; font-size: 13px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; }
.menu button .lbl2 { flex: 1; }
.menu button .mi { display: grid; color: var(--text2); }
.menu button .chev { color: var(--text3); }
.menu button .chk { width: 12px; }
.menu button:hover, .menu button.hl { background: #3d3d3d; }
.menu .sep { height: 1px; background: #3d3d3d; margin: 4px 6px; }
.menu .danger { color: #f87171; }
.toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--btn); color: var(--btn-text); font-size: 13px; padding: 7px 14px; border-radius: 999px; z-index: 40; }

.cfg { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.cfg pre { margin: 0; flex: 1; min-width: 0; background: var(--pane); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: 12px; color: var(--text2); overflow-x: auto; white-space: pre; }
.copy { border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-text); padding: 0 18px; font-size: 13px; font-weight: 500; cursor: pointer; min-height: 40px; }
/* the loops column at 80%: boxes and spacing at 0.8, text a little larger than that */
.loopscol { gap: 10px !important; }
.loopscol .count { padding: 11px 13px; gap: 8px; border-radius: 13px; }
.loopscol .count .big b { font-size: 24px; }
.loopscol .count .big span { font-size: 13px; }
.loopscol .track { height: 5px; }
.loopscol .split button { height: 23px; padding: 0 7px; font-size: 12.5px; gap: 6px; border-radius: 6px; }
.loopscol .rot-n { min-width: 17px; height: 17px; font-size: 11px; padding: 0 5px; }
.loopscol .act { padding: 11px 13px 10px; gap: 8px; border-radius: 13px; }
.loopscol .act-h b { font-size: 17px; }
.loopscol .act-h .long, .loopscol .act-h .long b { font-size: 11.5px; }
.hm { gap: 2.5px; }
.hm .cell { width: var(--c, 10px); height: var(--c, 10px); border-radius: 4px; }
.hm .mo { width: var(--c, 10px); }
.hm .cell.out { visibility: hidden; }
.hmclip { position: relative; overflow: hidden; }
.hm .cell.future { background: none; box-shadow: inset 0 0 0 1px #3a3a3a; }
.loopscol .hm .mo { font-size: 11px; }
.loopscol .hm .dl { font-size: 11.5px; }
.loopscol .legend { font-size: 11px; }
.loopscol .legend .cell, .loopscol .legend .curkey { width: 9px; height: 9px; }
.loopscol .ibtn { width: 22px; height: 22px; border-radius: 6px; }
.loopscol .fseg button { height: 19px; padding: 0 7px; font-size: 11.5px; }
.loopscol .fdrop { height: 22px; font-size: 11.5px; padding: 0 8px; }
.loopscol .fchip { height: 20px; font-size: 11.5px; }
.loopscol .row { min-height: 31px; gap: 8px; padding: 0 8px; border-radius: 8px; }
.loopscol .row .t1 { font-size: 12.5px; }
.loopscol .row.sub { min-height: 26px; }
.loopscol .row.sub .t1 { font-size: 12px; }
.loopscol .pname, .loopscol .when { font-size: 11.5px; }
.loopscol .when { width: 26px; }
.loopscol .frac { font-size: 11px; }
.loopscol .st { width: 13px; height: 13px; }
.loopscol .st-open { width: 11px; height: 11px; }
.loopscol .st-closed, .loopscol .st-rot { width: 12px; height: 12px; }
.loopscol .subs { margin-left: 21px; }
.loopscol .det { margin: 3px 8px 6px 29px; padding: 7px 8px; gap: 8px; border-radius: 8px; }
.loopscol .subs .det { margin-left: 29px; }

    if (it.id === 'status') { item.s = it.label === 'Closed' ? 'closed' : 'open'; render(); return; }
    if (it.id === 'label') { item.k = it.label; render(); return; }
    if (it.id === 'move') { l.p = it.label; render(); return; }
    toast(({ rename: 'Rename', archive: 'Archived', 'delete': 'Deleted' })[it.id] || it.label);
  }
  function findTarget(id) {
    var parts = String(id).split('.'), l = LOOPS[+parts[0]]; if (!l) return null;
    var sub = parts.length > 1 ? l.subs[+parts[1]] : null;
    return { loop: l, item: sub || l, sub: !!sub };
  }
  /* a long search shows its end, with a leading ellipsis over the cut start */
  function markOverflow(el) {
    if (!el) return;
    var over = el.scrollWidth > el.clientWidth + 1;
    if (over && document.activeElement !== el) el.scrollLeft = el.scrollWidth;
    el.parentNode.classList.toggle('over', over && el.scrollLeft > 0);
  }
  ['keyup', 'scroll', 'focusin', 'focusout', 'click'].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { if (e.target && e.target.id === 'projSearch') setTimeout(function () { markOverflow(e.target); }, 0); }, true);
  });
  stage.addEventListener('input', function (e) {
    if (e.target.id !== 'projSearch') return;
    var el = e.target; setTimeout(function () { markOverflow(el); }, 0);
    projectQuery = e.target.value;
    var wrap = stage.querySelector('#plistWrap'); if (wrap) wrap.innerHTML = projectRows(lastProjectsArgs[0], lastProjectsArgs[1]);
  });
  stage.addEventListener('contextmenu', function (e) {
    var row = e.target.closest('[data-i]'); if (!row) return;
    e.preventDefault();
    menuFor = findTarget(row.dataset.i); if (!menuFor) return;
    var sc = scale(), r = stage.getBoundingClientRect();
    showMenu(loopMenu(menuFor), Math.min((e.clientX - r.left) / sc, SW - 380), Math.min((e.clientY - r.top) / sc, SH - 160), 0);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
  document.addEventListener('click', function (e) { if (!e.target.closest('.menu') && !e.target.closest('[data-act]')) closeMenu(); });

  stage.addEventListener('click', function (e) {
    if (e.target.closest('.menu')) return;
    var b = e.target.closest('[data-act], [data-i], [data-f], [data-fs], [data-fl], [data-clear]'); if (!b) return;
    var a = b.dataset.act;
    if (b.dataset.f) { filter.status = filter.status === b.dataset.f ? 'all' : b.dataset.f; refilter(); return; }
    if (b.dataset.fs) { filter.status = b.dataset.fs; refilter(); return; }
    if (b.dataset.fl) { filter.label = filter.label === b.dataset.fl ? null : b.dataset.fl; refilter(); return; }
    if (b.dataset.clear) { if (b.dataset.clear === 'status') filter.status = 'all'; else filter[b.dataset.clear] = null; refilter(); return; }
    if (a === 'toggle-filters') {
      filterOpen = !filterOpen;
      var bar = b.closest('.fbar');
      bar.querySelectorAll('.fchip').forEach(function (c) { c.remove(); });
      bar.querySelector('.finline').classList.toggle('open', filterOpen);
      b.classList.toggle('on', filterOpen);
      setTimeout(render, 340);
      return;
    }
    if (a === 'more') { showAllProjects = !showAllProjects; render(); return; }
    if (a === 'progress-close' || a === 'progress-open') {
      var opening = a === 'progress-open', reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!opening) {
        var lay = stage.querySelector('.lay.prog');
        lay.style.gridTemplateColumns = progressCols(false); lay.style.columnGap = '0px';
        progressOpen = false; setTimeout(render, reduce ? 0 : 340); return;
      }
      progressOpen = true; render();
      if (reduce) return;
      var lay2 = stage.querySelector('.lay.prog');
      lay2.style.transition = 'none'; lay2.style.gridTemplateColumns = progressCols(false); lay2.style.columnGap = '0px';
      void lay2.offsetWidth; lay2.style.transition = '';
      lay2.style.gridTemplateColumns = progressCols(true); lay2.style.columnGap = '40px';
      return;
    }
    if (a === 'older') { slideMonths(Math.min(weekOffset + 1, 8)); return; }
    if (a === 'newer') { slideMonths(Math.max(weekOffset - 1, 0)); return; }
    if (a === 'project') {
      var r = b.getBoundingClientRect(), sr = stage.getBoundingClientRect(), sc = scale();
      var items = [{ id: 'pf', value: null, label: 'All', check: !filter.project }, 'sep'].concat(Object.keys(PROJ).map(function (p) { return { id: 'pf', value: p, label: p, check: filter.project === p }; }));
      showMenu(items, (r.left - sr.left) / sc, (r.bottom - sr.top) / sc + 4, 0);
      return;
    }
    if (b.dataset.i !== undefined) toggleLoop(b.dataset.i);
  });

  var copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', function () {
    var txt = document.getElementById('cfgOut').textContent;
    function done() { copyBtn.textContent = 'Copied'; setTimeout(function () { copyBtn.textContent = 'Copy config'; }, 1200); }
    function fallback() { var rg = document.createRange(); rg.selectNodeContents(document.getElementById('cfgOut')); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); }
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  });

  render();
})();
</script>
