<title>afterterm Next</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{
  --need:#fbbf24; --live:#4ade80;
  --bg:#212121; --side:#171717; --hover:#2f2f2f; --hover2:#383838; --raise:#2f2f2f;
  --text:#ececec; --text2:#b4b4b4; --text3:#8e8e8e; --text4:#5c5c5c;
  --btn:#ececec; --btn-text:#0d0d0d;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',Consolas,monospace;
  --sidebar:264px; --rail:56px; --toprow:56px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid rgba(236,236,236,.5);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
svg{display:block;flex:none}
:root{--ease:cubic-bezier(.2,.8,.2,1);--fast:140ms;--med:200ms}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view.active{animation:viewin var(--med) var(--ease)}
@keyframes popin{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}

.app{height:100vh;height:100dvh;overflow:hidden}
.view{display:none;height:100%;min-height:0}
.view.active{display:block}

.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text3);flex:none}
.ic{transition:background var(--fast),color var(--fast)}
.ic:hover{background:var(--hover);color:var(--text)}
.ic[aria-selected="true"]{background:var(--hover2);color:var(--text)}
.ib{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--text3);flex:none}
.ib{transition:opacity var(--fast),background var(--fast)}
.ib:hover{background:var(--hover2);color:var(--text)}
.ib.on{color:var(--text)}
.st{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.si{display:inline-grid;place-items:center;color:var(--text3);flex:none}
.si.need{color:var(--need)}
.si.run{color:var(--live)}
.si.ok{color:var(--live)}
.si.sleep{color:#a78bfa}
.sig{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;background:var(--hover2);font-size:12.5px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text2)}
.sig+.sig{margin-left:4px}
.st.live{background:var(--live)}.st.need{background:var(--need)}.st.gray{background:var(--text4)}
.spin{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--text3);border-right-color:transparent;animation:rot 1s linear infinite;flex:none;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.fo{flex:none}
.b{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:500;color:var(--text);background:var(--hover);white-space:nowrap}
.b{transition:background var(--fast)}
.b:hover{background:var(--hover2)}
.b.p{background:var(--btn);color:var(--btn-text)}
.b.p:hover{background:#fff}
.b.q{background:transparent;color:var(--text2)}
.b.q:hover{background:var(--hover);color:var(--text)}
.b.s{padding:5px 11px;font-size:13px}
.b.big{padding:12px 28px;font-size:15px}

/* brand row, shared by every screen */
.brand{height:var(--toprow);display:flex;align-items:center;gap:4px;padding:0 10px 0 14px;flex:none}
.brand .name{font-weight:500;margin-right:6px}
.brand .sp{flex:1}

/* home */
#view-home{overflow-y:auto}
.home{max-width:680px;margin:0 auto;padding:28px 24px 96px;display:flex;flex-direction:column;gap:36px}
.home h1{margin:0;font-size:26px;font-weight:500;letter-spacing:-.01em}
.home .sub{margin:6px 0 0;color:var(--text3)}
.home .tot{display:flex;gap:6px;margin-top:12px}
.lbl{font-size:13px;color:var(--text3);font-weight:500;margin:0 0 8px 12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cd{background:var(--raise);border-radius:16px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:14px;min-height:92px;cursor:pointer}
.cd{transition:background var(--fast)}
.cd:hover{background:var(--hover2)}
.cd .hd{display:flex;align-items:center;gap:10px}
.cd .n{font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .d{color:var(--text3);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .f{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:13px;margin-top:auto}
.cd .f .ago{margin-left:auto}
.cd .go{opacity:0}
.cd:hover .go{opacity:1}
.list{display:flex;flex-direction:column}
.pr{margin:1px 0;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;min-width:0;width:100%;cursor:pointer}
.pr{transition:background var(--fast)}
.pr:hover{background:var(--hover)}
.pr .sig{background:var(--hover)}
.pr:hover .sig{background:var(--hover2)}
.pr .tx{flex:1;min-width:0}
.pr .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .d{color:var(--text3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .t{color:var(--text3);font-size:13px;flex:none}
.pr .ib{opacity:0}
.pr:hover .ib,.pr .ib.on{opacity:1}
.more{color:var(--text3);padding:9px 12px;border-radius:12px;font-size:13px}
.more:hover{background:var(--hover);color:var(--text)}

/* workspace */
.work{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100%;min-height:0;transition:grid-template-columns var(--med) var(--ease)}
.work.collapsed{grid-template-columns:var(--rail) 1fr}
.side{background:var(--side);display:flex;flex-direction:column;min-height:0;padding:0 8px 8px}
.side .brand{margin:0 -8px}
.srow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text);width:100%;min-width:0;position:relative}
.srow:hover{background:var(--hover)}
.srow .g{width:18px;display:grid;place-items:center;color:var(--text3);flex:none}
.srow .k{font-size:11px;color:var(--text4);margin-left:auto;flex:none}
.scroll{overflow-y:auto;flex:1;min-height:0;margin-top:10px;display:flex;flex-direction:column;gap:18px}
.sec .lbl{margin:0 0 2px 12px}
.lblrow{display:flex;align-items:center;justify-content:space-between;margin-right:6px!important}
.lblrow .ib{width:24px;height:24px;color:var(--text3)}
.home .lblrow{margin-right:8px!important}
.home .lblrow .ib{opacity:1}
.side .lblrow .ib{opacity:0}
.side .sec:hover .lblrow .ib{opacity:1}
.pj{margin:1px 0;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:10px;font-weight:500;width:100%;min-width:0;cursor:pointer;user-select:none}
.pj:hover{background:var(--hover)}
.pj .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj .c{color:var(--text3);font-weight:400;font-size:12px}
.pj .ib{opacity:0;width:24px;height:24px}
.pj:hover .ib,.pj .ib.on{opacity:1}
.pj.dim{color:var(--text2);font-weight:400}
.th{margin:1px 0;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 32px;border-radius:10px;color:var(--text2);width:100%;min-width:0;cursor:pointer}
.th{transition:background var(--fast),color var(--fast)}
.th:hover{background:var(--hover);color:var(--text)}
.th.sel{background:var(--hover2);color:var(--text)}
.th .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.sleep{opacity:.45}
@keyframes glow-need{0%,100%{background:rgba(251,191,36,.05)}50%{background:rgba(251,191,36,.16)}}
@keyframes glow-ok{0%,100%{background:rgba(74,222,128,.04)}50%{background:rgba(74,222,128,.13)}}
.th.waiting:not(.sel){animation:glow-need 2.4s ease-in-out infinite}
.th.done:not(.sel){animation:glow-ok 2.8s ease-in-out infinite}
.th .prt{font-size:11px;color:var(--text3)}
.th input{background:var(--hover2);border:0;border-radius:6px;padding:2px 6px;width:100%;outline:none}
.tlw{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--med) var(--ease)}
.tlw.closed{grid-template-rows:0fr}
.tlw>.tli{overflow:hidden;min-height:0}
.thmore{padding:5px 12px 5px 34px;color:var(--text3);font-size:12.5px;border-radius:10px;width:100%}
.thmore:hover{background:var(--hover);color:var(--text)}
/* collapsed rail */
.rail{display:none;flex-direction:column;align-items:center;gap:4px;padding:11px 0}
.work.collapsed .side{padding:0}
.work.collapsed .side>*:not(.rail){display:none}
.work.collapsed .rail{display:flex}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.mh{height:var(--toprow);display:flex;align-items:center;gap:14px;padding:0 20px 0 20px;flex:none}
.mh .t{min-width:0;flex:1}
.mh .n{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;display:flex;align-items:center;gap:8px}
.mh .n span{overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--hover);color:var(--text2);font-size:13px;white-space:nowrap;margin-right:4px}
.ki{color:var(--text3);flex:none;display:inline-grid;place-items:center}
.th.sel .ki,.th:hover .ki{color:var(--text2)}
.mh .m{color:var(--text3);font-size:12.5px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;line-height:1.4}
.mh .m span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mh .acts{display:flex;gap:4px;flex:none;align-items:center}
.mh .menubtn{display:none}
.term{flex:1;min-height:0;overflow:auto;margin:0 16px 16px;background:#191919;border-radius:16px;padding:18px 22px;font-family:var(--mono);font-size:13px;line-height:1.6;color:#c8c8c8;position:relative}
.term .ln{white-space:pre-wrap;word-break:break-word}
.term .p{color:#9ad2cd}.term .g{color:#9cc9a5}.term .y{color:#d7b57c}.term .b{color:#9db3d6}.term .r{color:#d29a9a}.term .d{color:#6f6f6f}.term .m{color:#bda6d6}
.term .cursor{display:inline-block;width:7px;height:15px;background:#c8c8c8;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.term .dv{display:flex;align-items:center;gap:12px;color:var(--text4);font-family:var(--sans);font-size:12px;margin:14px 0}
.term .dv::before,.term .dv::after{content:"";flex:1;height:1px;background:#2c2c2c}
.term.asleep .past{opacity:.3;pointer-events:none}
.wakebox{position:sticky;top:20%;display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--sans);margin:-40px 0 0}
.wakebox .w{color:var(--text3);font-size:13px}
.empty{display:grid;place-items:center;height:100%;color:var(--text3)}

/* menus and popovers */
.menu{position:fixed;background:var(--hover);border-radius:12px;padding:6px;min-width:200px;box-shadow:0 8px 30px rgba(0,0,0,.45);z-index:100;display:none;transform-origin:top left}
.menu .hdrow{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px}
.menu .bk{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text2);padding:0}
.menu .bk:hover{background:var(--hover2);color:var(--text)}
.menu.show{display:block;animation:popin var(--fast) var(--ease)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:8px;color:var(--text)}
.menu button:hover{background:var(--hover2)}
.menu button .r{margin-left:auto;color:var(--text3);display:inline-grid;place-items:center}
.menu .hd{padding:6px 12px 4px;font-size:12px;color:var(--text3)}
.nt{position:fixed;background:var(--hover);border-radius:14px;padding:8px;width:280px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:60;display:none;transform-origin:top left}
.nt.show{display:block;animation:popin var(--med) var(--ease)}
.nt .hd{padding:6px 10px 6px;font-size:12px;color:var(--text3);font-weight:500}
.nt input{width:100%;background:var(--side);border:0;border-radius:8px;padding:7px 10px;outline:none;margin-bottom:6px}
.nt input::placeholder{color:var(--text3)}
.nt .opts{max-height:240px;overflow-y:auto;scrollbar-gutter:stable;padding-right:4px;margin-right:-4px}
.nt .opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px}
.nt .opt:hover,.nt .opt.hi{background:var(--hover2)}
.nt .opt .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt .opt .r{font-size:11.5px;color:var(--text3)}
.nt .foot{display:flex;align-items:center;gap:8px;padding:8px 10px 4px;border-top:1px solid #3a3a3a;margin-top:6px;font-size:12.5px;color:var(--text3)}
.nt .shb{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--hover2);color:var(--text);font-size:12.5px}
.nt .shb .ch{color:var(--text3);display:inline-grid;place-items:center;margin-left:2px}
.menu button svg{flex:none}
/* edit project dialog */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:85;align-items:center;justify-content:center;padding:16px}
.mbg.show{display:flex;animation:fadein var(--fast) var(--ease)}
.mbg.show .modal{animation:rise var(--med) var(--ease)}
.modal{width:min(520px,100%);background:var(--hover);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.55);padding:22px 22px 18px;display:flex;flex-direction:column;gap:18px;max-height:92vh;overflow-y:auto}
.modal h2{margin:0;font-size:18px;font-weight:500}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12.5px;color:var(--text3)}
.fld .in{display:flex;gap:8px}
.fld input[type=text]{flex:1;min-width:0;background:var(--side);border:0;border-radius:10px;padding:9px 12px;outline:none}
.fld input[type=text]:focus{box-shadow:0 0 0 2px rgba(236,236,236,.25)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;position:relative}
.sw button[aria-pressed="true"]{border-color:var(--text)}
.shl{display:flex;flex-direction:column;gap:2px}
.shl button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--text2)}
.shl button:hover{background:var(--hover2);color:var(--text)}
.shl button[aria-pressed="true"]{background:var(--hover2);color:var(--text)}
.shl button .r{margin-left:auto;font-size:12px;color:var(--text3)}
.chk{display:flex;align-items:center;gap:10px;color:var(--text2);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--text)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.seg{display:flex;background:var(--side);border-radius:999px;padding:3px}
.seg button{padding:4px 12px;border-radius:999px;color:var(--text3);font-weight:500;font-size:12.5px}
.seg button[aria-selected="true"]{background:var(--hover2);color:var(--text)}

.hover{position:fixed;z-index:50;width:280px;background:var(--hover);border-radius:14px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.5);display:none;pointer-events:none;transform-origin:top left}
.hover.show{display:block;animation:popin var(--med) var(--ease)}
.hover .hn{font-weight:500;margin-bottom:10px}
.hover dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:13px}
.hover dt{color:var(--text3)}
.hover dd{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hover .hl{margin-top:12px;padding-top:10px;border-top:1px solid #3a3a3a;font-family:var(--mono);font-size:11.5px;color:var(--text3);white-space:pre-wrap}

/* project page */
#view-project{overflow-y:auto}
.proj{max-width:720px;margin:0 auto;padding:16px 24px 96px;display:flex;flex-direction:column;gap:28px}
.back{color:var(--text3);align-self:flex-start;padding:6px 10px;margin-left:-10px;border-radius:999px}
.back:hover{background:var(--hover);color:var(--text)}
.ph h1{margin:0;font-size:26px;font-weight:500;display:flex;align-items:center;gap:12px;letter-spacing:-.01em}
.ph .f{color:var(--text3);margin:6px 0 0;font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
.ph .f span{display:inline-flex;align-items:center;gap:5px}
.ph .phl{min-width:0}
.ph .acts{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap;align-items:center;width:100%}
.ph .acts .push{margin-left:auto}
.ic.lg{width:36px;height:36px;border-radius:12px;background:var(--hover)}
.ic.lg:hover{background:var(--hover2)}
.tabs{display:flex;align-items:center;gap:12px}
.tabs .seg button{padding:5px 14px;font-size:14px}
.srch{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--side);border-radius:999px;padding:6px 14px;color:var(--text3)}
.srch input{background:transparent;border:0;width:160px;outline:none}
.srch input::placeholder{color:var(--text3)}
.tl{margin:1px 0;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;width:100%;min-width:0;cursor:pointer}
.tl:hover{background:var(--hover)}
.tl .tx{flex:1;min-width:0}
.tl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .d{color:var(--text3);font-size:13px}
.tl .t{color:var(--text3);font-size:13px;flex:none}
.tl .acts{display:none;flex:none}
.tl:hover .acts{display:flex}
.tl:hover .t{display:none}
.nothing{color:var(--text3);padding:28px 12px;text-align:center}

/* palette */
.palbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:80;align-items:flex-start;justify-content:center;padding-top:14vh}
.palbg.show{display:flex;animation:fadein var(--fast) var(--ease)}
.palbg.show .pal{animation:rise var(--med) var(--ease)}
.pal{width:min(600px,92vw);background:var(--hover);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.pal input{width:100%;background:transparent;border:0;padding:18px 22px;font-size:16px;outline:none}
.pal .res{max-height:50vh;overflow-y:auto;padding:6px 8px 10px;border-top:1px solid #3a3a3a}
.pal .gl{padding:10px 12px 4px;font-size:12px;color:var(--text3);font-weight:500}
.pi{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;width:100%;min-width:0}
.pi:hover,.pi.hi{background:var(--hover2)}
.pi .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .m{color:var(--text3);font-size:13px;white-space:nowrap}

.tip{position:fixed;z-index:110;background:#0d0d0d;color:var(--text);font-size:12px;font-weight:500;padding:5px 9px;border-radius:8px;pointer-events:none;opacity:0;transform:translate(-50%,2px);transition:opacity var(--fast),transform var(--fast);white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.tip.show{opacity:1;transform:translate(-50%,0)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);background:var(--hover);border-radius:999px;padding:10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:.18s;z-index:90;pointer-events:none;max-width:min(420px,90vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
@media (max-width:860px){
  .chip{padding:5px 10px;font-size:12px}
  .work,.work.collapsed{grid-template-columns:1fr}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .side.open{transform:none}
  .work.collapsed .side>*:not(.rail){display:flex}
  .work.collapsed .side .scroll{display:flex}
  .work.collapsed .rail{display:none}
  .scrim.show{display:block}
  .mh .menubtn{display:grid}

    <div class="sec"><div class="lbl">Pinned</div>${pinned.map(p=>{
    const n=threads.filter(t=>t.p===p.id).length,c=!!collapsed[p.id];
    return `<div><div class="pj" data-coll="${p.id}" data-pctx="${p.id}">${folder(p,!c)}<span class="n">${esc(p.name)}</span>${c?`<span class="c">${n}</span>`:''}${addBtn(p)}${goBtn(p)}</div>${c?'':`<div class="tlw ${opening===p.id?'closed':''}" data-tlw="${p.id}"><div class="tli">${threadList(p.id)}</div></div>`}</div>`}).join('')}</div>
    <div class="sec"><div class="lbl lblrow"><span>Projects</span><button class="ib" data-newproj data-tip="New project">${svg('i-plus',14)}</button></div>${rest.map(p=>{
    const n=threads.filter(t=>t.p===p.id).length,o=!!drawerOpen[p.id];
    return `<div><div class="pj dim" data-dcoll="${p.id}" data-pctx="${p.id}">${folder(p,o)}<span class="n">${esc(p.name)}</span>${n&&!o?`<span class="c">${n}</span>`:''}${projDots(p)}${addBtn(p)}${goBtn(p)}${pinBtn(p)}</div>${o?`<div class="tlw ${opening===p.id?'closed':''}" data-tlw="${p.id}"><div class="tli">${threadList(p.id)}</div></div>`:''}</div>`}).join('')}</div>`;
  const toggle=(id,isOpen,setOpen,setClosed)=>{
    if(isOpen){const w=s.querySelector(`[data-tlw="${id}"]`);if(w&&!matchMedia('(prefers-reduced-motion:reduce)').matches){w.classList.add('closed');w.addEventListener('transitionend',()=>{setClosed();renderWork()},{once:true})}else{setClosed();renderWork()}}
    else{setOpen();opening=id;renderWork()}
  };
  s.querySelectorAll('[data-coll]').forEach(b=>b.onclick=e=>{if(e.target.closest('button'))return;const id=b.dataset.coll;toggle(id,!collapsed[id],()=>collapsed[id]=false,()=>collapsed[id]=true)});
  s.querySelectorAll('[data-dcoll]').forEach(b=>b.onclick=e=>{if(e.target.closest('button'))return;const id=b.dataset.dcoll;toggle(id,!!drawerOpen[id],()=>drawerOpen[id]=true,()=>drawerOpen[id]=false)});
  if(opening){const w=s.querySelector(`[data-tlw="${opening}"]`);opening=null;if(w)requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.remove('closed')))}
  s.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{expanded[b.dataset.more]=!expanded[b.dataset.more];renderWork()});
  s.querySelector('[data-newproj]').onclick=()=>openEdit(null);
  s.querySelectorAll('[data-th]').forEach(r=>{r.onclick=()=>{selectThread(r.dataset.th);renderWork();closeSide()};r.onmouseenter=()=>showHover(r.dataset.th,r);r.onmouseleave=hideHover});
  const rn=s.querySelector('[data-rename]');if(rn){rn.focus();rn.select();const done=ok=>{if(ok&&rn.value.trim())T(rn.dataset.rename).name=rn.value.trim();renaming=null;renderWork()};rn.onkeydown=e=>{if(e.key==='Enter')done(true);if(e.key==='Escape')done(false)};rn.onblur=()=>done(true)}
  bind(s);
  renderMain();
}
function renderMain(){
  const m=document.getElementById('main'),t=T(selected);
  if(!t){m.innerHTML=`<div class="mh"><button class="ic menubtn" data-side>${svg('i-menu',18)}</button></div><div class="empty">Pick a thread</div>`;bindSide(m);return}
  const p=t.p?P(t.p):null,asleep=t.state==='sleeping';
  const lines=t.lines.map(([c,s])=>c==='cur'?'<div class="ln"><span class="cursor"></span></div>':c==='dv'?`<div class="dv">${esc(s)}</div>`:`<div class="ln"><span class="${c}">${esc(s)}</span></div>`).join('');
  m.innerHTML=`<div class="mh"><button class="ic menubtn" data-side>${svg('i-menu',18)}</button><div class="t"><div class="n">${kindIcon(t,16)}<span>${esc(t.name)}</span></div><div class="m">
      <span>${p?folder(p,true,15):svg('i-term',14)}${p?esc(p.name):'General'}</span>
      ${t.model?`<span>${svg('i-model',14)}${esc(t.model)}</span>`:''}
      ${t.branch?`<span>${svg('i-branch',14)}${esc(t.branch)}</span>`:''}
      ${t.wt?`<span>${svg('i-worktree',14)}${esc(t.wt)}</span>`:''}</div></div>
    <div class="acts">${t.state==='idle'?'':`<span class="chip">${dotFor(t)}${stateText(t)}</span>`}<button class="ic" data-menu aria-label="More">${svg('i-more',18)}</button></div></div>
    <div class="term ${asleep?'asleep':''}">${asleep?`<div class="wakebox"><button class="b p big" data-wake>Wake</button><span class="w">${kindWord[t.kind]} asleep since ${t.ago==='now'?'just now':t.ago+' ago'}${t.kind==='server'?` · runs ${esc(t.last)}`:''}</span></div><div class="past">${lines}</div>`:lines}</div>`;
  m.querySelectorAll('[data-wake]').forEach(b=>b.onclick=()=>wake(t));
  m.querySelector('[data-menu]').onclick=e=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();showMenu(r.right-200,r.bottom+4,threadMenu(t.id))};
  bindSide(m);
}
function bindSide(m){const b=m.querySelector('[data-side]');if(b)b.onclick=()=>{sideEl.classList.toggle('open');scrim.classList.toggle('show',sideEl.classList.contains('open'))}}
document.getElementById('side-search').onclick=openPal;
function showHover(id,rowEl){
  if(window.matchMedia('(max-width:860px)').matches)return;
  const t=T(id),h=document.getElementById('hover');
  h.innerHTML=`<div class="hn">${esc(t.name)}</div><dl><dt>Type</dt><dd>${kindWord[t.kind]} · ${stateWord[t.state]}${t.port?` on :${t.port}`:''}</dd>${t.model?`<dt>Model</dt><dd>${esc(t.model)}</dd>`:''}${t.branch?`<dt>Branch</dt><dd>${esc(t.branch)}</dd>`:''}${t.wt?`<dt>Worktree</dt><dd>${esc(t.wt)}</dd>`:''}${t.last?`<dt>Last ran</dt><dd>${esc(t.last)}</dd>`:''}<dt>Active</dt><dd>${t.ago==='now'?'now':t.ago+' ago'}</dd></dl><div class="hl">${esc(t.lines.filter(l=>l[1]&&l[0]!=='cur'&&l[0]!=='dv').slice(-2).map(l=>l[1]).join('\n'))}</div>`;
  const r=rowEl.getBoundingClientRect();h.style.left=(r.right+8)+'px';h.style.top=Math.min(r.top-8,window.innerHeight-250)+'px';h.classList.add('show');
}
function hideHover(){document.getElementById('hover').classList.remove('show')}
const sideEl=document.getElementById('side'),scrim=document.getElementById('scrim');
scrim.onclick=closeSide;function closeSide(){sideEl.classList.remove('open');scrim.classList.remove('show')}

/* project page */
function renderProject(id){
  currentProj=id;const p=P(id),tab=projTab[id]||'live';
  const live=liveOf(id),sl=sleepOf(id),hist=history.filter(h=>h.p===id);
  const el=document.getElementById('proj');
  el.innerHTML=`<button class="back" data-back>← Home</button>
    <div class="ph"><div class="phl"><h1>${folder(p,true,26)}${esc(p.name)}</h1>
      <p class="f"><span>${esc(p.folder)}</span><span>${svg('i-branch',13)} ${esc(p.branch)}</span><span>${shellName(p.shell)}</span></p>
      <div class="acts"><button class="b p" data-open="${p.id}">Open</button><button class="b" data-add="${p.id}">New thread</button><button class="b" data-focus="${p.id}">${p.focused?'Unpin':'Pin'}</button><button class="b" data-edit>Edit</button><button class="b q" data-arch>${p.archived?'Restore':'Archive'}</button><button class="ic lg push" data-explorer="${p.id}" data-tip="Open in File Explorer">${svg('i-explorer',20)}</button><button class="ic lg" data-vscode="${p.id}" data-tip="Open in VS Code">${svg('i-vscode',20)}</button></div></div></div>
    <div><div class="tabs"><div class="seg">${[['live','Live',live.length],['sleep','Asleep',sl.length],['hist','History',hist.length]].map(([k,l,n])=>`<button data-tab="${k}" aria-selected="${tab===k}">${l} <span style="opacity:.6">${n}</span></button>`).join('')}</div>
      <label class="srch">${svg('i-search',15)}<input id="hs" placeholder="Search"></label></div>
      <div class="list" id="tlist" style="margin-top:12px"></div></div>`;
  const list=el.querySelector('#tlist');
  const draw=q=>{q=(q||'').toLowerCase();
    if(tab==='hist'){const rows=hist.filter(h=>h.title.toLowerCase().includes(q));
      list.innerHTML=rows.map((h,i)=>`<div class="tl"><span class="ki">${svg(h.resumable?'i-chat':'i-shell',15)}</span><div class="tx"><div class="n">${esc(h.title)}</div><div class="d">${h.resumable?'Chat':'Shell'}</div></div><span class="t">${h.when}</span><div class="acts">${h.resumable?`<button class="b q s" data-res="${i}">Resume</button>`:''}</div></div>`).join('')||'<div class="nothing">Nothing here</div>';
      list.querySelectorAll('[data-res]').forEach(b=>b.onclick=e=>{e.stopPropagation();const h=rows[+b.dataset.res];const nt={id:'t'+Date.now(),p:id,kind:'chat',model:'Opus 5',name:h.title,state:'done',ago:'now',branch:p.branch,wt:'',last:'claude --resume',lines:[['d','claude --resume …'],['',''],['g','Resumed: '+h.title],['p','> '],['cur','']]};threads.unshift(nt);history.splice(history.indexOf(h),1);selectThread(nt.id);go('work')});
      return}
    const rows=(tab==='live'?live:sl).filter(t=>t.name.toLowerCase().includes(q));
    list.innerHTML=rows.map(t=>`<div class="tl" data-jump="${t.id}" data-tctx="${t.id}">${kindIcon(t)}<div class="tx"><div class="n">${esc(t.name)}</div><div class="d">${kindWord[t.kind]}${t.branch?' · '+esc(t.branch):''}${t.wt?' · '+esc(t.wt):''}${t.port?` · :${t.port}`:''}</div></div>${t.state==='sleeping'?'':dotFor(t)}<span class="t">${t.ago}</span><div class="acts"><button class="b q s">Open</button></div></div>`).join('')||`<div class="nothing">${tab==='live'?'Nothing running':'Nothing asleep'}</div>`;
    list.querySelectorAll('[data-jump]').forEach(r=>r.onclick=()=>{selectThread(r.dataset.jump);go('work')});
    bind(list);
  };
  draw();
  el.querySelector('#hs').oninput=e=>{if(tab!=='hist'){projTab[id]='hist';renderProject(id);const i=document.getElementById('hs');i.value=e.target.value;i.focus();i.dispatchEvent(new Event('input'));return}draw(e.target.value)};
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{projTab[id]=b.dataset.tab;renderProject(id)});
  el.querySelector('[data-back]').onclick=()=>go('home');
  el.querySelector('[data-arch]').onclick=()=>archive(id,!p.archived);
  el.querySelector('[data-edit]').onclick=()=>openEdit(id);
  bind(el);
}

/* palette */
const palbg=document.getElementById('palbg'),palin=document.getElementById('palin'),palres=document.getElementById('palres');
let items=[],hi=0;
function openPal(){palbg.classList.add('show');palin.value='';query('');setTimeout(()=>palin.focus(),0)}
function closePal(){palbg.classList.remove('show')}
palbg.onclick=e=>{if(e.target===palbg)closePal()};
function query(q){q=q.toLowerCase();items=[];let html='';
  const pr=projects.filter(p=>p.name.toLowerCase().includes(q)),th=threads.filter(t=>t.name.toLowerCase().includes(q)),hs=history.filter(h=>h.title.toLowerCase().includes(q));
  if(pr.length){html+='<div class="gl">Projects</div>'+pr.map(p=>{items.push(()=>openWorkspace(p.id));return `<button class="pi" data-i="${items.length-1}">${folder(p,true,16)}<span class="n">${esc(p.name)}</span><span class="m">${p.ago}</span></button>`}).join('')}
  if(th.length){html+='<div class="gl">Threads</div>'+th.map(t=>{items.push(()=>{selectThread(t.id);go('work')});return `<button class="pi" data-i="${items.length-1}">${kindIcon(t)}<span class="n">${esc(t.name)}</span>${t.state==='sleeping'?'':dotFor(t)}<span class="m">${t.p?esc(P(t.p).name):'General'}</span></button>`}).join('')}
  if(hs.length){html+='<div class="gl">History</div>'+hs.slice(0,8).map(h=>{items.push(()=>{projTab[h.p]='hist';go('project',h.p)});return `<button class="pi" data-i="${items.length-1}"><span class="ki">${svg(h.resumable?'i-chat':'i-shell',15)}</span><span class="n">${esc(h.title)}</span><span class="m">${esc(P(h.p).name)} · ${h.when}</span></button>`}).join('')}
  palres.innerHTML=html||'<div class="nothing">No results</div>';hi=0;paint();
  palres.querySelectorAll('.pi').forEach(b=>b.onclick=()=>{closePal();items[+b.dataset.i]()})}
function paint(){palres.querySelectorAll('.pi').forEach((b,i)=>b.classList.toggle('hi',i===hi));const e=palres.querySelector('.pi.hi');e&&e.scrollIntoView({block:'nearest'})}
palin.oninput=e=>query(e.target.value);
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();palbg.classList.contains('show')?closePal():openPal();return}
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='t'){e.preventDefault();if(view!=='work')go('work');const a=sideCollapsed?document.querySelector('.rail [data-newthread]'):document.getElementById('side-new');openNT(a);return}
  if(!palbg.classList.contains('show'))return;
  if(e.key==='Escape')closePal();
  if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(hi+1,items.length-1);paint()}
  if(e.key==='ArrowUp'){e.preventDefault();hi=Math.max(hi-1,0);paint()}
  if(e.key==='Enter'&&items[hi]){closePal();items[hi]()}
});
/* tooltips */
const tip=document.getElementById('tip');let tipT;
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(!el)return;clearTimeout(tipT);tipT=setTimeout(()=>{const r=el.getBoundingClientRect();tip.textContent=el.dataset.tip;tip.style.left=(r.left+r.width/2)+'px';tip.style.top=(r.bottom+6)+'px';tip.classList.add('show')},350)});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('[data-tip]')){clearTimeout(tipT);tip.classList.remove('show')}});
document.addEventListener('click',()=>{clearTimeout(tipT);tip.classList.remove('show')});
renderHome();
</script>
