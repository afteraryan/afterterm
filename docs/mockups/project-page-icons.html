<title>Project Page Icon Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#212121;--side:#171717;--hover:#2f2f2f;--hover2:#383838;--text:#ececec;--text2:#b4b4b4;--text3:#8e8e8e;--teal:#2dd4bf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:22px;font-weight:500;margin:0 0 6px}
p{color:var(--text3);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.opt{background:var(--hover);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.opt .hd{display:flex;align-items:center;gap:10px}
.opt .num{width:24px;height:24px;border-radius:50%;background:var(--hover2);display:grid;place-items:center;font-size:12px;color:var(--text2);flex:none}
.opt .nm{font-weight:500}
.sizes{display:flex;align-items:center;gap:22px;color:var(--text3)}
.sizes svg{display:block}
.row{display:flex;align-items:center;gap:8px;background:var(--side);border-radius:12px;padding:8px 6px 8px 12px}
.row .f{color:var(--teal)}
.row .n{flex:1;font-weight:500}
.row .ib{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--text3);background:var(--hover2)}
.row .pin{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--text)}
svg{flex:none}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="folder" viewBox="0 0 24 24"><path d="M2.5 7A2 2 0 0 1 4.5 5h4.6l2 2h7.4a2 2 0 0 1 2 2v1.5H6.6a2 2 0 0 0-1.9 1.4L2.5 17z" fill="currentColor" fill-opacity=".72"/><path d="M2.6 18.2 5 11.9a1.5 1.5 0 0 1 1.4-1H22l-2.7 7.1a2 2 0 0 1-1.9 1.3H4.3a1.8 1.8 0 0 1-1.7-2.1z" fill="currentColor"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path d="M15 3h-6l1 2v5.5L7 13v2h4v6h2v-6h4v-2l-3-2.5V5z" fill="currentColor"/></symbol>
  <symbol id="o1" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="o2" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 9.5h17" stroke="currentColor" stroke-width="1.7"/><rect x="3.5" y="4.5" width="17" height="5" rx="2.5" fill="currentColor" fill-opacity=".45"/><path d="M7 13.5h6M7 16.5h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="o3" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.7"/><path d="M12.5 9h5M12.5 12h5M12.5 15h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="o4" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="o5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 4v16" stroke="currentColor" stroke-width="1.8"/><path d="m8 9.5 2.5 2.5L8 14.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="o6" viewBox="0 0 24 24"><path d="M2.5 7A2 2 0 0 1 4.5 5h4.6l2 2h8.4a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m10.6 10.35 2.9 2.9-2.9 2.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="o7" viewBox="0 0 24 24"><path d="M2.5 7A2 2 0 0 1 4.5 5h4.6l2 2h8.4a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.5 15.5 15 10M11 10h4v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="o8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m10.5 8.5 3.5 3.5-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="o9" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="4" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="4" y="13" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
  <symbol id="o10" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11a1 1 0 0 1 1 1v14a1 1 0 0 1-1-1H5.5A1.5 1.5 0 0 1 4 16.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13a1 1 0 0 0-1 1v14a1 1 0 0 1 1-1h5.5a1.5 1.5 0 0 0 1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="o11" viewBox="0 0 24 24"><path d="M2.5 7A2 2 0 0 1 4.5 5h4.6l2 2h8.4a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="11.5" cy="13" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m13.5 15 2.5 2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="o12" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v5M12 8v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>
<div class="wrap">
  <h1>Project page icon options</h1>
  <p>Each option at three sizes, and as it would sit on a project row next to the pin.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const opts=[
  ['o1','Chevron'],['o2','Page with header band'],['o3','Page layout'],['o4','Expand corners'],
  ['o5','Open side panel'],['o6','Folder with chevron'],['o7','Folder with arrow out'],['o8','Circle chevron'],
  ['o9','Four squares'],['o10','Open book'],['o11','Folder with magnifier'],['o12','Info circle']
];
document.getElementById('grid').innerHTML=opts.map(([id,nm],i)=>`<div class="opt">
  <div class="hd"><span class="num">${i+1}</span><span class="nm">${nm}</span></div>
  <div class="sizes"><svg width="16" height="16"><use href="#${id}"/></svg><svg width="24" height="24"><use href="#${id}"/></svg><svg width="40" height="40"><use href="#${id}"/></svg></div>
  <div class="row"><svg class="f" width="18" height="18"><use href="#folder"/></svg><span class="n">aftertales</span><span class="ib"><svg width="16" height="16"><use href="#${id}"/></svg></span><span class="pin"><svg width="16" height="16"><use href="#pin"/></svg></span></div>
</div>`).join('');
</script>
